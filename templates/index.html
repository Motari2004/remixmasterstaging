<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📦 Staging + Zernio</title>
  <style>
    :root {
      --bg: #0f1115; --panel: #171a21; --panel2: #1e222b;
      --border: #2a2f3a; --text: #e6e9ef; --muted: #8b93a7;
      --accent: #7c5cff; --accent2: #00d4ff;
      --ok: #22c55e; --warn: #f59e0b; --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: radial-gradient(1200px 600px at 10% -10%, #1a1f2e, var(--bg)) fixed;
      color: var(--text); min-height: 100vh; padding: 24px;
    }
    .app { max-width: 1200px; margin: 0 auto; }
    h1 {
      font-size: 1.6rem; margin-bottom: 4px;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .sub { color: var(--muted); margin-bottom: 20px; font-size: 0.85rem; }
    a { color: var(--accent2); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

    .nav {
      display: flex; gap: 4px; margin-bottom: 16px;
      background: var(--panel2); padding: 4px; border-radius: 10px;
      border: 1px solid var(--border); width: fit-content;
      align-items: center;
    }
    .nav button {
      padding: 7px 14px; border-radius: 7px; background: transparent;
      color: var(--muted); border: none; cursor: pointer;
      font-size: 0.82rem; font-weight: 600; font-family: inherit;
    }
    .nav button:hover { color: var(--text); }
    .nav button.active {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: white;
    }

    .stats { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
    .stat { background: var(--panel); padding: 12px 18px; border-radius: 10px;
            border: 1px solid var(--border); flex: 1; min-width: 140px; }
    .stat strong { display: block; font-size: 1.5rem; color: var(--accent2);
                   margin-bottom: 2px; }
    .stat span { color: var(--muted); font-size: 0.75rem;
                 text-transform: uppercase; letter-spacing: 1px; }

    table { width: 100%; border-collapse: collapse; background: var(--panel);
            border-radius: 10px; overflow: hidden; }
    th, td { padding: 10px 14px; text-align: left;
             border-bottom: 1px solid var(--border); font-size: 0.85rem; }
    th { background: var(--panel2); color: var(--muted);
         font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px; }
    tr:hover td { background: var(--panel2); }
    .title-cell { max-width: 380px; overflow: hidden;
                  text-overflow: ellipsis; white-space: nowrap; }

    .pill { display: inline-block; padding: 3px 10px; border-radius: 999px;
            font-size: 0.7rem; font-weight: 700; text-transform: uppercase;
            letter-spacing: 0.5px; }
    .pill.direct  { background: rgba(34,197,94,0.15);  color: #4ade80; }
    .pill.staging { background: rgba(245,158,11,0.15); color: #fcd34d; }
    .pill.insta   { background: rgba(124,92,255,0.15); color: #a78bfa; }
    .pill.tiktok  { background: rgba(0,212,255,0.15);  color: #67e8f9; }
    .pill.youtube { background: rgba(239,68,68,0.15);  color: #fca5a5; }
    .pill.facebook{ background: rgba(59,130,246,0.15); color: #93c5fd; }
    .pill.zernio  { background: rgba(139,92,246,0.15); color: #c4b5fd; }

    button {
      cursor: pointer; background: var(--panel2); color: var(--text);
      border: 1px solid var(--border); border-radius: 6px;
      padding: 5px 10px; font-size: 0.78rem; font-family: inherit;
      margin-right: 4px;
    }
    button:hover { border-color: var(--accent); }
    button.danger { color: #fca5a5; }
    button.primary {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: white; border: none; font-weight: 700;
    }

    .empty { padding: 30px; text-align: center; color: var(--muted);
             background: var(--panel); border-radius: 10px;
             border: 1px dashed var(--border); }

    .view { display: none; }
    .view.active { display: block; }

    .section-title { font-size: 1.1rem; margin-bottom: 14px; }
    .section-title small { color: var(--muted); font-size: 0.8rem;
                           font-weight: normal; margin-left: 8px; }

    .toast {
      position: fixed; bottom: 24px; right: 24px;
      background: var(--panel2); border: 1px solid var(--accent);
      color: var(--text); padding: 12px 20px; border-radius: 10px;
      font-size: 0.85rem; z-index: 999; max-width: 400px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.4);
    }
    .toast.err { border-color: var(--danger); }

    .slot-list { background: #0f1115; border: 1px solid var(--border);
                 border-radius: 8px; padding: 10px;
                 font-family: monospace; font-size: 0.78rem;
                 display: grid; grid-template-columns: repeat(3, 1fr);
                 gap: 6px; margin-top: 10px; }
    .slot-list div { padding: 3px 6px; background: #171a21; border-radius: 4px; }
    .now-slot { color: var(--accent2); }
    .err { color: var(--danger); font-size: 0.78rem; }

    /* ---- Zernio panel header ---- */
    .zernio-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      gap: 12px;
      flex-wrap: wrap;
    }
    .zernio-title {
      font-size: 1.1rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .zernio-title .badge {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 3px 9px;
      border-radius: 999px;
      background: rgba(139,92,246,0.15);
      color: #c4b5fd;
    }
    .zernio-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .zernio-cache {
      font-size: 0.78rem;
      color: var(--muted);
    }
    .zernio-cache .cache-tag { color: var(--accent2); }
    .zernio-cache .live-tag  { color: var(--ok); }

    .refresh-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 16px;
      border-radius: 8px;
      background: linear-gradient(135deg, rgba(124,92,255,0.18), rgba(0,212,255,0.18));
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 0.82rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.15s ease;
      margin: 0;
    }
    .refresh-btn:hover {
      border-color: var(--accent);
      background: linear-gradient(135deg, rgba(124,92,255,0.3), rgba(0,212,255,0.3));
      transform: translateY(-1px);
    }
    .refresh-btn:active { transform: translateY(0); }
    .refresh-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    .refresh-btn .icon {
      display: inline-block;
      font-size: 0.95rem;
      transition: transform 0.5s ease;
    }
    .refresh-btn.spinning .icon {
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    .refresh-status {
      font-size: 0.78rem;
      min-height: 1em;
      transition: opacity 0.3s ease;
    }
    .refresh-status .live-tag { color: var(--ok); }
    .refresh-status .err { color: var(--danger); }
  </style>
</head>
<body>
<div class="app">

  <h1>📦 Staging + Zernio</h1>
  <div class="sub">Buffer queue · Zernio queue · both live</div>

  <div class="nav">
    <button data-nav="dashboard" class="active">📊 Buffer</button>
    <button data-nav="zernio">🎬 Zernio</button>
    <button data-nav="log">📜 Sent Log</button>
  </div>

  <!-- =================== BUFFER DASHBOARD =================== -->
  <section id="view-dashboard" class="view active">
    <div class="stats" id="stats"></div>
    <div id="dashboard-body"></div>
  </section>

  <!-- =================== ZERNIO =================== -->
  <section id="view-zernio" class="view">

    <div class="zernio-header">
      <div class="zernio-title">
        🎬 Zernio Queue
        <span class="badge">live</span>
      </div>

      <div class="zernio-actions">
        <span class="zernio-cache" id="zernio-cache-info">—</span>
        <span class="refresh-status" id="zernio-refresh-status"></span>
        <button class="refresh-btn" id="zernio-refresh" title="Force refresh from Zernio">
          <span class="icon">🔄</span>
          <span>Refresh</span>
        </button>
      </div>
    </div>

    <div class="stats" id="zernio-stats"></div>
    <div id="zernio-body"></div>
    <div id="zernio-detail"></div>
  </section>

  <!-- =================== LOG =================== -->
  <section id="view-log" class="view">
    <h2 class="section-title">Recent Buffer sends</h2>
    <div id="log-body"></div>
  </section>

</div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);

function showView(name) {
  document.querySelectorAll(".view").forEach(v =>
    v.classList.toggle("active", v.id === "view-" + name));
  document.querySelectorAll(".nav button[data-nav]").forEach(b =>
    b.classList.toggle("active", b.dataset.nav === name));
}

document.querySelectorAll("[data-nav]").forEach(b => {
  b.addEventListener("click", (e) => {
    e.preventDefault();
    const t = b.dataset.nav;
    showView(t);
    if (t === "dashboard") loadDashboard();
    if (t === "zernio") loadZernio(false);
    if (t === "log") loadLog();
  });
});

function toast(msg, isError) {
  const t = document.createElement("div");
  t.className = "toast" + (isError ? " err" : "");
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 4000);
}

function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function fmtDate(iso) {
  if (!iso) return "—";
  try {
    const d = new Date(iso);
    return d.toLocaleString("en-GB", {
      timeZone: "Africa/Nairobi",
      year: "numeric", month: "short", day: "2-digit",
      hour: "2-digit", minute: "2-digit",
    });
  } catch (e) { return iso; }
}

// -----------------------------------------------------
// BUFFER DASHBOARD
// -----------------------------------------------------
async function loadDashboard() {
  try {
    const r = await fetch("/api/summary");
    const d = await r.json();
    const rows = d.rows || [];
    const totalPending = rows.reduce((s, r) => s + (r.pending || 0), 0);
    const totalSent    = rows.reduce((s, r) => s + (r.sent_today || 0), 0);
    $("stats").innerHTML = `
      <div class="stat"><strong>${rows.length}</strong><span>Buffer channels</span></div>
      <div class="stat"><strong>${totalPending}</strong><span>Staged pending</span></div>
      <div class="stat"><strong>${totalSent}</strong><span>Sent today</span></div>
    `;
    if (!rows.length) {
      $("dashboard-body").innerHTML =
        `<div class="empty">No Buffer niches found.</div>`;
      return;
    }
    $("dashboard-body").innerHTML = `
      <table>
        <thead>
          <tr>
            <th>Niche</th><th>Platform</th><th>Mode</th>
            <th>Pending</th><th>Sent today</th><th>Last drain</th>
          </tr>
        </thead>
        <tbody>
          ${rows.map(r => `
            <tr>
              <td>${esc(r.label)}</td>
              <td><span class="pill ${esc(r.platform)}">${esc(r.platform)}</span></td>
              <td><span class="pill ${esc(r.mode)}">${esc(r.mode)}</span></td>
              <td>${r.pending}</td>
              <td>${r.sent_today}</td>
              <td>${esc(fmtDate(r.last_drain))}</td>
            </tr>
          `).join("")}
        </tbody>
      </table>
    `;
  } catch (e) {
    toast("Dashboard error: " + e.message, true);
  }
}

// -----------------------------------------------------
// ZERNIO PANEL — cached + debounced + force-refreshable
// -----------------------------------------------------
let zernioLastLoad = 0;
let zernioInFlight = false;

async function loadZernio(force) {
  const now = performance.now();
  if (!force && zernioInFlight) return;
  if (!force && now - zernioLastLoad < 500) return;
  zernioLastLoad = now;
  zernioInFlight = true;

  const t0 = performance.now();
  const url = "/api/zernio/niches" + (force ? "?force=1" : "");

  if (force) {
    $("zernio-refresh-status").innerHTML =
      `<span class="live-tag">refreshing…</span>`;
  }

  if (!$("zernio-body").innerHTML.trim()) {
    $("zernio-body").innerHTML =
      `<div class="empty">Loading Zernio niches…</div>`;
  }

  try {
    const r = await fetch(url);
    const d = await r.json();
    const elapsed = Math.round(performance.now() - t0);
    const rows = d.rows || [];

    const totalScheduled = rows.reduce((s, r) => s + (r.scheduled_total || 0), 0);
    const totalSlots     = rows.reduce((s, r) => s + (r.slots_free || 0), 0);
    const okCount        = rows.filter(r => !r.error).length;

    $("zernio-stats").innerHTML = `
      <div class="stat"><strong>${rows.length}</strong><span>Zernio channels</span></div>
      <div class="stat"><strong>${okCount}</strong><span>Reachable</span></div>
      <div class="stat"><strong>${totalSlots}</strong><span>Free slots</span></div>
      <div class="stat"><strong>${totalScheduled}</strong><span>Scheduled posts</span></div>
    `;

    const tag = d.cached
      ? `<span class="cache-tag">⚡ cached</span>`
      : `<span class="live-tag">🔄 live</span>`;
    $("zernio-cache-info").innerHTML =
      `${tag} · ${elapsed}ms · ${rows.length} niches`;

    if (force) {
      $("zernio-refresh-status").innerHTML =
        `<span class="live-tag">✓ ${elapsed}ms</span>`;
      setTimeout(() => {
        const el = $("zernio-refresh-status");
        if (el) el.textContent = "";
      }, 3000);
    }

    if (!rows.length) {
      $("zernio-body").innerHTML =
        `<div class="empty">No Zernio niches found in config.json</div>`;
      return;
    }

    $("zernio-body").innerHTML = `
      <table>
        <thead>
          <tr>
            <th>Niche</th><th>Queue</th>
            <th>Free slots</th><th>Scheduled</th>
            <th>Next slot</th><th></th>
          </tr>
        </thead>
        <tbody>
          ${rows.map(r => `
            <tr>
              <td>
                <strong>${esc(r.label)}</strong>
                ${r.error ? `<div class="err">${esc(r.error)}</div>` : ""}
              </td>
              <td>${esc(r.queue_name || "—")}</td>
              <td>${r.slots_free}</td>
              <td>${r.scheduled_total}</td>
              <td>${esc(fmtDate(r.next_slot))}</td>
              <td>
                <button data-zernio-posts="${esc(r.niche)}">📋 View posts</button>
              </td>
            </tr>
          `).join("")}
        </tbody>
      </table>
    `;

    $("zernio-body").querySelectorAll("[data-zernio-posts]").forEach(b => {
      b.addEventListener("click", () => loadZernioPosts(b.dataset.zernioPosts, b));
    });
  } catch (e) {
    $("zernio-body").innerHTML =
      `<div class="empty err">Error: ${esc(e.message)}</div>`;
    if (force) {
      $("zernio-refresh-status").innerHTML =
        `<span class="err">refresh failed</span>`;
    }
  } finally {
    zernioInFlight = false;
  }
}

async function loadZernioPosts(niche, btn) {
  const row = btn.closest("tr");
  const label = row ? row.querySelector("strong").textContent : niche;
  $("zernio-detail").innerHTML =
    `<div class="empty">Loading posts for ${esc(label)}…</div>`;
  const t0 = performance.now();
  try {
    const r = await fetch(
      `/api/zernio/posts/${encodeURIComponent(niche)}?limit=50`
    );
    const d = await r.json();
    if (!d.success) throw new Error(d.error || "failed");

    const posts = d.posts || [];
    const pag   = d.pagination || {};
    const total = pag.total || posts.length;
    const pages = pag.pages || 1;
    const elapsed = Math.round(performance.now() - t0);

    $("zernio-detail").innerHTML = `
      <h2 class="section-title" style="margin-top:24px">
        ${esc(label)}
        <small>${total} scheduled · page ${pag.page || 1} of ${pages} · ${elapsed}ms</small>
      </h2>
      <table>
        <thead>
          <tr><th>Title</th><th>Scheduled</th><th>Status</th><th>Video</th></tr>
        </thead>
        <tbody>
          ${posts.map(p => `
            <tr>
              <td class="title-cell" title="${esc(p.title)}">${esc(p.title || "(untitled)")}</td>
              <td>${esc(fmtDate(p.scheduled_for))}</td>
              <td>${esc(p.status)}</td>
              <td>
                ${p.media_url
                  ? `<a href="${esc(p.media_url)}" target="_blank">open</a>`
                  : "—"}
              </td>
            </tr>
          `).join("")}
        </tbody>
      </table>
    `;
  } catch (e) {
    $("zernio-detail").innerHTML =
      `<div class="empty err" style="margin-top:24px">Error: ${esc(e.message)}</div>`;
  }
}

// Force-refresh button (inside Zernio panel)
document.getElementById("zernio-refresh").addEventListener("click", () => {
  const btn = $("zernio-refresh");
  btn.disabled = true;
  btn.classList.add("spinning");
  $("zernio-refresh-status").innerHTML =
    `<span class="live-tag">warming cache…</span>`;

  fetch("/api/zernio/refresh", { method: "POST" })
    .then(() => {
      setTimeout(() => {
        loadZernio(true).finally(() => {
          btn.disabled = false;
          btn.classList.remove("spinning");
        });
      }, 1200);
    })
    .catch(() => {
      $("zernio-refresh-status").innerHTML =
        `<span class="err">refresh failed</span>`;
      btn.disabled = false;
      btn.classList.remove("spinning");
    });
});

// -----------------------------------------------------
// LOG
// -----------------------------------------------------
async function loadLog() {
  $("log-body").innerHTML = `<div class="empty">Loading…</div>`;
  try {
    const r = await fetch("/api/log");
    const d = await r.json();
    const rows = d.rows || [];
    if (!rows.length) {
      $("log-body").innerHTML = `<div class="empty">No sends yet.</div>`;
      return;
    }
    $("log-body").innerHTML = `
      <table>
        <thead>
          <tr><th>ID</th><th>Niche</th><th>Title</th>
              <th>Sent at</th><th>Buffer id</th></tr>
        </thead>
        <tbody>
          ${rows.map(r => `
            <tr>
              <td>${r.id}</td>
              <td>${esc(r.niche)}</td>
              <td class="title-cell">${esc(r.title)}</td>
              <td>${esc(fmtDate(r.sent_at))}</td>
              <td>${esc(r.buffer_post_id || "—")}</td>
            </tr>
          `).join("")}
        </tbody>
      </table>
    `;
  } catch (e) {
    $("log-body").innerHTML =
      `<div class="empty err">Error: ${esc(e.message)}</div>`;
  }
}

// -----------------------------------------------------
// Start
// -----------------------------------------------------
loadDashboard();
</script>
</body>
</html>
