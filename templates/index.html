<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f1115">
  <meta name="color-scheme" content="dark">
  <title>📦 Staging + Zernio</title>
  <style>
    /* =====================================================
       1. DESIGN TOKENS
       ===================================================== */
    :root {
      --bg: #0f1115;
      --panel: #171a21;
      --panel2: #1e222b;
      --panel-hover: #232833;
      --border: #2a2f3a;
      --text: #e6e9ef;
      --muted: #8b93a7;
      --muted-2: #6b7280;
      --accent: #7c5cff;
      --accent2: #00d4ff;
      --ok: #22c55e;
      --ok-soft: #4ade80;
      --warn: #f59e0b;
      --warn-soft: #fcd34d;
      --danger: #ef4444;
      --danger-soft: #fca5a5;

      /* Platform brand colors */
      --c-youtube:   #ff0000;
      --c-youtube-b: rgba(255,0,0,0.12);
      --c-tiktok:    #ffffff;
      --c-tiktok-b:  rgba(255,255,255,0.08);
      --c-instagram: #e4405f;
      --c-instagram-b: rgba(228,64,95,0.12);
      --c-facebook:  #1877f2;
      --c-facebook-b: rgba(24,119,242,0.12);
      --c-zernio:    #c4b5fd;
      --c-zernio-b:  rgba(139,92,246,0.14);
      --c-unknown:   #8b93a7;
      --c-unknown-b: rgba(139,148,167,0.14);

      /* Spacing */
      --s-1: 4px;
      --s-2: 8px;
      --s-3: 12px;
      --s-4: 16px;
      --s-5: 20px;
      --s-6: 24px;
      --s-7: 32px;

      /* Radii */
      --r-sm: 6px;
      --r-md: 8px;
      --r-lg: 10px;
      --r-xl: 14px;

      /* Motion */
      --ease: cubic-bezier(0.4, 0, 0.2, 1);
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      --dur-fast: 120ms;
      --dur: 180ms;
      --dur-slow: 300ms;

      /* Layout */
      --shell-pad: var(--s-4);
      --max-width: 1200px;
    }

    /* =====================================================
       2. RESET
       ===================================================== */
    *, *::before, *::after { box-sizing: border-box; }
    * { margin: 0; padding: 0; }

    html {
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
      scroll-behavior: smooth;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto,
                   "Helvetica Neue", Arial, sans-serif;
      font-size: 15px;
      line-height: 1.5;
      background: radial-gradient(
        1200px 600px at 10% -10%,
        #1a1f2e 0%,
        var(--bg) 60%
      ) fixed;
      color: var(--text);
      min-height: 100dvh;
      padding: var(--shell-pad);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* =====================================================
       3. LAYOUT SHELL
       ===================================================== */
    .app {
      max-width: var(--max-width);
      margin-inline: auto;
      display: flex;
      flex-direction: column;
      gap: var(--s-4);
    }

    .app-header {
      display: flex;
      flex-direction: column;
      gap: var(--s-1);
    }

    h1 {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      line-height: 1.2;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .sub { color: var(--muted); font-size: 0.82rem; }

    /* =====================================================
       4. NAV
       ===================================================== */
    .nav {
      display: flex;
      gap: 2px;
      padding: 4px;
      background: var(--panel2);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      width: 100%;
      overflow-x: auto;
      overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      scroll-snap-type: x proximity;
    }
    .nav::-webkit-scrollbar { display: none; }

    .nav button {
      appearance: none;
      background: transparent;
      border: 0;
      color: var(--muted);
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      padding: 10px 16px;
      border-radius: var(--r-md);
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      min-height: 40px;
      scroll-snap-align: start;
      transition: color var(--dur-fast) var(--ease),
                  background var(--dur-fast) var(--ease),
                  transform var(--dur-fast) var(--ease);
    }
    .nav button:hover { color: var(--text); }
    .nav button:active { transform: scale(0.97); }
    .nav button.active {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
      box-shadow:
        0 4px 12px -2px rgba(124,92,255,0.35),
        inset 0 1px 0 rgba(255,255,255,0.08);
    }

    /* =====================================================
       5. VIEWS
       ===================================================== */
    .view {
      display: none;
      animation: viewFade var(--dur-slow) var(--ease-out);
    }
    .view.active { display: block; }

    @keyframes viewFade {
      from { opacity: 0; transform: translateY(4px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
      html { scroll-behavior: auto; }
    }

    /* =====================================================
       6. STATS
       ===================================================== */
    .stats {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: var(--s-3);
      margin-bottom: var(--s-4);
    }

    .stat {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      padding: 14px 16px;
      min-width: 0;
    }

    .stat strong {
      display: block;
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--accent2);
      line-height: 1.1;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
      margin-bottom: 4px;
    }
    .stat span {
      display: block;
      color: var(--muted);
      font-size: 0.68rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.7px;
      line-height: 1.3;
      word-break: break-word;
    }

















    /* Toggle button (styled like a stat card) */
    .stat.toggle-card {
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 6px;
      padding: 12px 14px;
      min-width: 0;
      overflow: hidden;
      transition: border-color var(--dur) var(--ease),
                  background var(--dur) var(--ease);
      user-select: none;
    }
    .stat.toggle-card:hover { border-color: var(--accent); }
    .stat.toggle-card:active { transform: scale(0.98); }

    .toggle-card .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-width: 0;
    }
    .toggle-card .toggle-row > div {
      min-width: 0;
      overflow: hidden;
    }
    .toggle-card .toggle-label {
      display: block;
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.7px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .toggle-card .toggle-state {
      display: block;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--accent2);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: color var(--dur) var(--ease);
    }
    .toggle-card[data-on="true"] .toggle-state { color: var(--ok-soft); }

    /* Constrain the switch so it never forces the card wider */
    .stat.toggle-card .switch {
      width: 36px;
      height: 20px;
    }
    .stat.toggle-card .slider:before {
      height: 14px;
      width: 14px;
      left: 2px;
      bottom: 2px;
    }
    .stat.toggle-card .switch input:checked + .slider:before {
      transform: translateX(16px);
    }

















    /* iOS-style switch */
    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
      flex-shrink: 0;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background: var(--panel2);
      border: 1px solid var(--border);
      transition: background var(--dur) var(--ease),
                  border-color var(--dur) var(--ease);
      border-radius: 999px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 16px;
      width: 16px;
      left: 3px;
      bottom: 3px;
      background: var(--muted);
      transition: transform var(--dur) var(--ease),
                  background var(--dur) var(--ease);
      border-radius: 50%;
    }
    .switch input:checked + .slider {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-color: transparent;
    }
    .switch input:checked + .slider:before {
      transform: translateX(20px);
      background: #fff;
    }

    /* =====================================================
       7. TABLES
       ===================================================== */
    .table-wrap {
      width: 100%;
      overflow-x: auto;
      overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }
    .table-wrap::-webkit-scrollbar { height: 8px; }
    .table-wrap::-webkit-scrollbar-track { background: transparent; }
    .table-wrap::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 4px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 640px;
    }
    th, td {
      text-align: left;
      padding: 12px 16px;
      font-size: 0.83rem;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
      vertical-align: middle;
    }
    th {
      position: sticky;
      top: 0;
      z-index: 1;
      background: var(--panel2);
      color: var(--muted);
      font-weight: 600;
      font-size: 0.66rem;
      text-transform: uppercase;
      letter-spacing: 0.9px;
    }
    tbody tr { transition: background var(--dur-fast) var(--ease); }
    tbody tr:hover td { background: var(--panel2); }
    tbody tr:last-child td { border-bottom: 0; }

    .title-cell {
      max-width: 280px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* =====================================================
       8. PLATFORM PILLS (with SVG icons)
       ===================================================== */
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      white-space: nowrap;
      line-height: 1.4;
      border: 1px solid transparent;
      transition: background var(--dur) var(--ease),
                  border-color var(--dur) var(--ease),
                  color var(--dur) var(--ease);
    }
    .pill .pi {
      width: 12px;
      height: 12px;
      flex-shrink: 0;
      display: inline-block;
      vertical-align: middle;
    }
    .pill .pi path { fill: currentColor; }

    .pill.direct  { background: rgba(34,197,94,0.14);  color: var(--ok-soft);
                    border-color: rgba(34,197,94,0.25); }
    .pill.staging { background: rgba(245,158,11,0.14); color: var(--warn-soft);
                    border-color: rgba(245,158,11,0.25); }

    .pill.youtube   { background: var(--c-youtube-b);   color: var(--c-youtube);
                      border-color: rgba(255,0,0,0.25); }
    .pill.tiktok    { background: var(--c-tiktok-b);    color: var(--c-tiktok);
                      border-color: rgba(255,255,255,0.18); }
    .pill.instagram,
    .pill.insta     { background: var(--c-instagram-b); color: var(--c-instagram);
                      border-color: rgba(228,64,95,0.28); }
    .pill.facebook  { background: var(--c-facebook-b);  color: var(--c-facebook);
                      border-color: rgba(24,119,242,0.28); }
    .pill.zernio    { background: var(--c-zernio-b);    color: var(--c-zernio);
                      border-color: rgba(139,92,246,0.25); }
    .pill.unknown   { background: var(--c-unknown-b);   color: var(--c-unknown);
                      border-color: rgba(139,148,167,0.25); }

    /* When icons are OFF — hide the SVG */
    body[data-buffer-icons="off"] #view-dashboard .pill .pi,
    body[data-zernio-icons="off"] #view-zernio .pill .pi {
      display: none;
    }

    /* =====================================================
       9. BUTTONS
       ===================================================== */
    button { font-family: inherit; cursor: pointer; }

    .btn {
      appearance: none;
      background: var(--panel2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: var(--r-md);
      padding: 9px 14px;
      font-size: 0.82rem;
      font-weight: 500;
      min-height: 38px;
      transition: background var(--dur) var(--ease),
                  border-color var(--dur) var(--ease),
                  transform var(--dur-fast) var(--ease);
    }
    .btn:hover {
      background: var(--panel-hover);
      border-color: var(--accent);
    }
    .btn:active { transform: scale(0.97); }

    /* =====================================================
       10. EMPTY / ERROR
       ===================================================== */
    .empty {
      padding: 40px 24px;
      text-align: center;
      color: var(--muted);
      background: var(--panel);
      border: 1px dashed var(--border);
      border-radius: var(--r-lg);
      font-size: 0.9rem;
    }
    .empty.err { border-color: rgba(239,68,68,0.35); color: var(--danger-soft); }
    .err { color: var(--danger-soft); font-size: 0.74rem; margin-top: 2px; }

    /* =====================================================
       11. ZERNIO HEADER
       ===================================================== */
    .zernio-header {
      display: flex;
      flex-direction: column;
      gap: var(--s-3);
      margin-bottom: var(--s-4);
    }
    .zernio-title {
      display: flex;
      align-items: center;
      gap: var(--s-2);
      font-size: 1.05rem;
      font-weight: 700;
    }
    .zernio-title .badge {
      font-size: 0.62rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      padding: 3px 9px;
      border-radius: 999px;
      background: var(--c-zernio-b);
      color: var(--c-zernio);
      border: 1px solid rgba(139,92,246,0.28);
    }
    .zernio-actions {
      display: flex;
      align-items: center;
      gap: var(--s-2);
      flex-wrap: wrap;
    }
    .zernio-cache {
      font-size: 0.74rem;
      color: var(--muted);
      flex: 1 1 auto;
      min-width: 0;
    }
    .zernio-cache .cache-tag { color: var(--accent2); font-weight: 600; }
    .zernio-cache .live-tag  { color: var(--ok-soft); font-weight: 600; }

    .refresh-status {
      font-size: 0.74rem;
      min-height: 1em;
    }
    .refresh-status .live-tag { color: var(--ok-soft); font-weight: 600; }
    .refresh-status .err { color: var(--danger-soft); }

    .refresh-btn {
      appearance: none;
      display: inline-flex;
      align-items: center;
      gap: var(--s-2);
      padding: 10px 16px;
      border-radius: var(--r-md);
      background: linear-gradient(135deg,
        rgba(124,92,255,0.20), rgba(0,212,255,0.20));
      border: 1px solid var(--border);
      color: var(--text);
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 600;
      min-height: 40px;
      flex-shrink: 0;
      transition: background var(--dur) var(--ease),
                  border-color var(--dur) var(--ease),
                  transform var(--dur-fast) var(--ease),
                  box-shadow var(--dur) var(--ease);
    }
    .refresh-btn:hover {
      border-color: var(--accent);
      background: linear-gradient(135deg,
        rgba(124,92,255,0.30), rgba(0,212,255,0.30));
      box-shadow: 0 4px 14px -4px rgba(124,92,255,0.4);
    }
    .refresh-btn:active { transform: scale(0.97); }
    .refresh-btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }
    .refresh-btn .icon {
      display: inline-block;
      font-size: 0.95rem;
      line-height: 1;
    }
    .refresh-btn.spinning .icon {
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    /* =====================================================
       12. PLATFORM BREAKDOWN
       ===================================================== */
    .platform-breakdown {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: var(--s-2);
      margin-bottom: var(--s-4);
    }
    .platform-breakdown .label {
      color: var(--muted-2);
      font-size: 0.66rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.9px;
      margin-right: var(--s-1);
    }

    /* =====================================================
       13. MOBILE CARDS
       ===================================================== */
    .cards {
      display: flex;
      flex-direction: column;
      gap: var(--s-3);
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      padding: 14px;
    }
    .card .top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: var(--s-3);
      margin-bottom: var(--s-3);
    }
    .card .name {
      font-size: 0.95rem;
      font-weight: 600;
      line-height: 1.35;
      min-width: 0;
      word-break: break-word;
    }
    .card .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: var(--s-3) var(--s-4);
      margin-bottom: var(--s-3);
    }
    .card .field { min-width: 0; }
    .card .field .k {
      display: block;
      color: var(--muted-2);
      font-size: 0.62rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 3px;
    }
    .card .field .v {
      display: block;
      font-size: 0.86rem;
      font-variant-numeric: tabular-nums;
      word-break: break-word;
    }
    .card .actions {
      display: flex;
      gap: var(--s-2);
      margin-top: var(--s-2);
    }
    .card .actions .btn,
    .card .actions button { flex: 1; }

    /* =====================================================
       14. SECTION TITLE
       ===================================================== */
    .section-title {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: var(--s-2);
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: var(--s-3);
    }
    .section-title small {
      color: var(--muted);
      font-size: 0.75rem;
      font-weight: 400;
    }

    /* =====================================================
       15. TOAST
       ===================================================== */
    .toast {
      position: fixed;
      left: var(--s-4);
      right: var(--s-4);
      bottom: var(--s-4);
      z-index: 9999;
      background: var(--panel2);
      border: 1px solid var(--accent);
      color: var(--text);
      padding: 12px 16px;
      border-radius: var(--r-lg);
      font-size: 0.85rem;
      text-align: center;
      box-shadow: 0 12px 40px -8px rgba(0,0,0,0.6);
      animation: toastIn var(--dur-slow) var(--ease-out);
    }
    .toast.err { border-color: var(--danger); }
    @keyframes toastIn {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* =====================================================
       ACCOUNTS TAB
       ===================================================== */
    .accounts-header {
      display: flex;
      flex-direction: column;
      gap: var(--s-3);
      margin-bottom: var(--s-4);
    }
    .accounts-title { font-size: 1.05rem; font-weight: 700; }
    .accounts-actions {
      display: flex;
      align-items: center;
      gap: var(--s-3);
      flex-wrap: wrap;
    }
    .accounts-count {
      color: var(--muted);
      font-size: 0.78rem;
      flex: 1 1 auto;
    }
    .view-toggle {
      display: inline-flex;
      background: var(--panel2);
      border: 1px solid var(--border);
      border-radius: var(--r-md);
      padding: 2px;
      gap: 2px;
    }
    .view-btn {
      appearance: none;
      background: transparent;
      border: 0;
      color: var(--muted);
      font-family: inherit;
      font-size: 0.78rem;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: var(--r-sm);
      cursor: pointer;
      min-height: 32px;
    }
    .view-btn:hover { color: var(--text); }
    .view-btn.active {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
    }

    .accounts-controls {
      display: flex;
      flex-direction: column;
      gap: var(--s-3);
      margin-bottom: var(--s-4);
    }
    .accounts-search {
      width: 100%;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--r-md);
      padding: 10px 14px;
      font-size: 0.85rem;
      color: var(--text);
      font-family: inherit;
    }
    .accounts-search::placeholder { color: var(--muted-2); }
    .accounts-search:focus {
      outline: none;
      border-color: var(--accent);
    }

    .accounts-filters {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .chip {
      appearance: none;
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--muted);
      font-family: inherit;
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 6px 12px;
      border-radius: 999px;
      cursor: pointer;
      transition: all var(--dur) var(--ease);
    }
    .chip:hover { color: var(--text); border-color: var(--accent); }
    .chip.active {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-color: transparent;
      color: #fff;
    }

    .workspace {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      margin-bottom: var(--s-3);
      overflow: hidden;
    }
    .workspace-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: var(--s-3);
      padding: 12px 16px;
      background: var(--panel2);
      border-bottom: 1px solid var(--border);
    }
    .workspace-email {
      display: flex;
      align-items: center;
      gap: var(--s-2);
      min-width: 0;
    }
    .workspace-email .em {
      font-weight: 600;
      font-size: 0.88rem;
      word-break: break-all;
    }
    .workspace-email .em.missing {
      color: var(--warn-soft);
      font-style: italic;
    }
    .workspace-count {
      color: var(--muted);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.7px;
      flex-shrink: 0;
    }
    .workspace-body { padding: 4px 0; }
    .workspace-row {
      display: grid;
      grid-template-columns: minmax(0, 2fr) auto auto minmax(0, 1.5fr);
      gap: var(--s-3);
      padding: 10px 16px;
      align-items: center;
      border-bottom: 1px solid var(--border);
      font-size: 0.85rem;
    }
    .workspace-row:last-child { border-bottom: 0; }
    .wr-name { min-width: 0; }
    .wr-name strong { display: block; word-break: break-word; }
    .wr-key {
      display: block;
      color: var(--muted-2);
      font-size: 0.72rem;
      font-family: monospace;
      margin-top: 1px;
    }
    .wr-publisher {
      color: var(--muted);
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .wr-id code, .id-cell {
      font-family: monospace;
      font-size: 0.72rem;
      color: var(--muted);
      background: var(--panel2);
      padding: 2px 6px;
      border-radius: var(--r-sm);
      border: 1px solid var(--border);
    }
    .email-cell {
      font-family: monospace;
      font-size: 0.78rem;
    }
    .email-missing {
      color: var(--warn-soft);
      font-style: italic;
      font-size: 0.78rem;
    }
    .copy-btn {
      appearance: none;
      background: var(--panel2);
      border: 1px solid var(--border);
      border-radius: var(--r-sm);
      color: var(--text);
      padding: 4px 8px;
      font-size: 0.78rem;
      cursor: pointer;
      transition: all var(--dur) var(--ease);
    }
    .copy-btn:hover { border-color: var(--accent); }
    .copy-btn:active { transform: scale(0.95); }

    @media (max-width: 639px) {
      .workspace-row {
        grid-template-columns: 1fr auto;
        row-gap: var(--s-2);
      }
      .wr-platform, .wr-publisher { display: none; }
      .wr-id { grid-column: 1 / -1; }
    }

    /* =====================================================
       16. RESPONSIVE — TABLET
       ===================================================== */
    @media (min-width: 640px) {
      :root { --shell-pad: var(--s-5); }
      h1 { font-size: 1.5rem; }
      .stats {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
      .stat { padding: 16px 18px; }
      .stat strong { font-size: 1.5rem; }
      .stat span { font-size: 0.7rem; }

      .zernio-header {
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
      }
      .zernio-actions { flex: 0 1 auto; flex-wrap: nowrap; }
      .zernio-cache { flex: 0 1 auto; }

      .toast {
        left: auto;
        right: var(--s-6);
        bottom: var(--s-6);
        max-width: 420px;
        text-align: left;
      }
    }

    /* =====================================================
       17. RESPONSIVE — DESKTOP
       ===================================================== */
    @media (min-width: 900px) {
      :root { --shell-pad: var(--s-6); }
      body { font-size: 15.5px; }
      h1 { font-size: 1.6rem; }
      .nav { width: fit-content; }
      table { min-width: 0; }
      .title-cell { max-width: 400px; }
    }

    /* =====================================================
       18. MOBILE CARDS vs DESKTOP TABLES
       ===================================================== */
    @media (max-width: 639px) {
      .table-wrap { display: none !important; }
      .cards { display: flex; }
    }
    @media (min-width: 640px) {
      .cards { display: none !important; }
    }

    /* =====================================================
       19. FOCUS
       ===================================================== */
    :focus-visible {
      outline: 2px solid var(--accent2);
      outline-offset: 2px;
      border-radius: var(--r-sm);
    }

    /* =====================================================
       20. SCROLLBAR (desktop body)
       ===================================================== */
    @media (min-width: 900px) {
      body::-webkit-scrollbar { width: 10px; }
      body::-webkit-scrollbar-track { background: transparent; }
      body::-webkit-scrollbar-thumb {
        background: var(--border);
        border-radius: 5px;
        border: 2px solid var(--bg);
      }
      body::-webkit-scrollbar-thumb:hover { background: #3a4050; }
    }
  </style>

const LABEL = {
  youtube:   "youtube",
  tiktok:    "tiktok",
  instagram: "instagram",
  insta:     "instagram",
  facebook:  "facebook",
  unknown:   "unknown",
};

// -----------------------------------------------------
// Toggle state
// -----------------------------------------------------
function loadPrefs() {
  try {
    const b = localStorage.getItem("bufferIcons");
    const z = localStorage.getItem("zernioIcons");
    if (b === "off" || b === "on")
      document.body.dataset.bufferIcons = b;
    if (z === "off" || z === "on")
      document.body.dataset.zernioIcons = z;
  } catch (e) {}
}

function setPref(scope, value) {
  try {
    if (scope === "buffer") localStorage.setItem("bufferIcons", value);
    if (scope === "zernio") localStorage.setItem("zernioIcons", value);
  } catch (e) {}
  if (scope === "buffer")
    document.body.dataset.bufferIcons = value;
  if (scope === "zernio")
    document.body.dataset.zernioIcons = value;
}

loadPrefs();

// -----------------------------------------------------
// Helpers
// -----------------------------------------------------
function iconFor(platform) {
  const p = String(platform || "").toLowerCase();
  if (p === "youtube") return ICONS.youtube;
  if (p === "tiktok") return ICONS.tiktok;
  if (p === "instagram" || p === "insta") return ICONS.instagram;
  if (p === "facebook") return ICONS.facebook;
  return ICONS.unknown;
}

function labelFor(platform) {
  const p = String(platform || "").toLowerCase();
  return LABEL[p] || p || "—";
}

function platformPill(platform) {
  const p = String(platform || "unknown").toLowerCase();
  const cls = ["youtube","tiktok","instagram","facebook"].includes(p) ? p : "unknown";
  return `<span class="pill ${cls}">${iconFor(p)}${labelFor(p)}</span>`;
}

function showView(name) {
  document.querySelectorAll(".view").forEach(v =>
    v.classList.toggle("active", v.id === "view-" + name));
  document.querySelectorAll(".nav button[data-nav]").forEach(b =>
    b.classList.toggle("active", b.dataset.nav === name));
}

document.querySelectorAll("[data-nav]").forEach(b => {
  b.addEventListener("click", (e) => {
    e.preventDefault();
    const t = b.dataset.nav;
    showView(t);
    if (t === "dashboard") loadDashboard();
    if (t === "zernio") loadZernio(false);
    if (t === "accounts") loadAccounts();
    if (t === "log") loadLog();
  });
});

function toast(msg, isError) {
  const t = document.createElement("div");
  t.className = "toast" + (isError ? " err" : "");
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 4000);
}

function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function fmtDate(iso) {
  if (!iso) return "—";
  try {
    const d = new Date(iso);
    return d.toLocaleString("en-GB", {
      timeZone: "Africa/Nairobi",
      year: "numeric", month: "short", day: "2-digit",
      hour: "2-digit", minute: "2-digit",
    });
  } catch (e) { return iso; }
}

function toggleCardHtml(scope, label, current) {
  const on = current === "on";
  return `
    <div class="stat toggle-card" data-toggle-scope="${scope}" data-on="${on}">
      <div class="toggle-row">
        <div>
          <span class="toggle-label">${label}</span>
          <div class="toggle-state">${on ? "icons ON" : "icons OFF"}</div>
        </div>
        <label class="switch">
          <input type="checkbox" ${on ? "checked" : ""} data-toggle-input="${scope}">
          <span class="slider"></span>
        </label>
      </div>
    </div>`;
}

function wireToggles() {
  document.querySelectorAll("[data-toggle-input]").forEach(input => {
    input.addEventListener("change", (e) => {
      const scope = e.target.dataset.toggleInput;
      const value = e.target.checked ? "on" : "off";
      setPref(scope, value);
      // Update the label text without full re-render
      const card = e.target.closest(".toggle-card");
      if (card) {
        card.dataset.on = (value === "on").toString();
        const stateEl = card.querySelector(".toggle-state");
        if (stateEl) stateEl.textContent = value === "on" ? "icons ON" : "icons OFF";
      }
    });
  });
}

// -----------------------------------------------------
// BUFFER DASHBOARD
// -----------------------------------------------------
async function loadDashboard() {
  try {
    const r = await fetch("/api/summary");
    const d = await r.json();
    const rows = d.rows || [];
    const totalPending = rows.reduce((s, r) => s + (r.pending || 0), 0);
    const totalSent    = rows.reduce((s, r) => s + (r.sent_today || 0), 0);

    const current = document.body.dataset.bufferIcons || "on";

    $("stats").innerHTML = `
      <div class="stat"><strong>${rows.length}</strong><span>Buffer channels</span></div>
      <div class="stat"><strong>${totalPending}</strong><span>Staged pending</span></div>
      <div class="stat"><strong>${totalSent}</strong><span>Sent today</span></div>
      ${toggleCardHtml("buffer", "Platform icons", current)}
    `;
    wireToggles();

    if (!rows.length) {
      $("dashboard-body").innerHTML =
        `<div class="empty">No Buffer niches found.</div>`;
      return;
    }

    const cardsHtml = `
      <div class="cards">
        ${rows.map(r => `
          <div class="card">
            <div class="top">
              <div class="name">${esc(r.label)}</div>
              <span class="pill ${esc(r.mode)}">${esc(r.mode)}</span>
            </div>
            <div class="grid">
              <div class="field">
                <span class="k">Platform</span>
                <span class="v">${platformPill(r.platform)}</span>
              </div>
              <div class="field">
                <span class="k">Pending</span>
                <span class="v">${r.pending}</span>
              </div>
              <div class="field">
                <span class="k">Sent today</span>
                <span class="v">${r.sent_today}</span>
              </div>
              <div class="field">
                <span class="k">Last drain</span>
                <span class="v">${esc(fmtDate(r.last_drain))}</span>
              </div>
            </div>
          </div>
        `).join("")}
      </div>
    `;

    const tableHtml = `
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Niche</th><th>Platform</th><th>Mode</th>
              <th>Pending</th><th>Sent today</th><th>Last drain</th>
            </tr>
          </thead>
          <tbody>
            ${rows.map(r => `
              <tr>
                <td>${esc(r.label)}</td>
                <td>${platformPill(r.platform)}</td>
                <td><span class="pill ${esc(r.mode)}">${esc(r.mode)}</span></td>
                <td>${r.pending}</td>
                <td>${r.sent_today}</td>
                <td>${esc(fmtDate(r.last_drain))}</td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      </div>
    `;

    $("dashboard-body").innerHTML = cardsHtml + tableHtml;
  } catch (e) {
    toast("Dashboard error: " + e.message, true);
  }
}

// -----------------------------------------------------
// ZERNIO PANEL
// -----------------------------------------------------
let zernioLastLoad = 0;
let zernioInFlight = false;

async function loadZernio(force) {
  const now = performance.now();
  if (!force && zernioInFlight) return;
  if (!force && now - zernioLastLoad < 500) return;
  zernioLastLoad = now;
  zernioInFlight = true;

  const t0 = performance.now();
  const url = "/api/zernio/niches" + (force ? "?force=1" : "");

  if (force) {
    $("zernio-refresh-status").innerHTML =
      `<span class="live-tag">refreshing…</span>`;
  }
  if (!$("zernio-body").innerHTML.trim()) {
    $("zernio-body").innerHTML =
      `<div class="empty">Loading Zernio niches…</div>`;
  }

  try {
    const r = await fetch(url);
    const d = await r.json();
    const elapsed = Math.round(performance.now() - t0);
    const rows = d.rows || [];

    const totalScheduled = rows.reduce((s, r) => s + (r.scheduled_total || 0), 0);
    const totalSlots     = rows.reduce((s, r) => s + (r.slots_free || 0), 0);
    const okCount        = rows.filter(r => !r.error).length;

    const current = document.body.dataset.zernioIcons || "on";

    $("zernio-stats").innerHTML = `
      <div class="stat"><strong>${rows.length}</strong><span>Zernio channels</span></div>
      <div class="stat"><strong>${okCount}</strong><span>Reachable</span></div>
      <div class="stat"><strong>${totalSlots}</strong><span>Free slots</span></div>
      ${toggleCardHtml("zernio", "Platform icons", current)}
    `;
    wireToggles();

    // Platform breakdown
    const byPlatform = {};
    rows.forEach(r => {
      const p = (r.platform || "unknown").toLowerCase();
      byPlatform[p] = (byPlatform[p] || 0) + 1;
    });
    const bdEl = $("zernio-platform-breakdown");
    if (Object.keys(byPlatform).length) {
      const pills = Object.entries(byPlatform)
        .sort()
        .map(([p, n]) => `${platformPill(p)}&nbsp;<span style="color:var(--muted);font-size:0.72rem">${n}</span>`)
        .join(" ");
      bdEl.innerHTML = `<span class="label">By platform</span> ${pills}`;
      bdEl.style.display = "flex";
    } else {
      bdEl.style.display = "none";
    }

    const tag = d.cached
      ? `<span class="cache-tag">⚡ cached</span>`
      : `<span class="live-tag">🔄 live</span>`;
    $("zernio-cache-info").innerHTML =
      `${tag} · ${elapsed}ms · ${rows.length} niches`;

    if (force) {
      $("zernio-refresh-status").innerHTML =
        `<span class="live-tag">✓ ${elapsed}ms</span>`;
      setTimeout(() => {
        const el = $("zernio-refresh-status");
        if (el) el.textContent = "";
      }, 3000);
    }

    if (!rows.length) {
      $("zernio-body").innerHTML =
        `<div class="empty">No Zernio niches found in settings.json</div>`;
      return;
    }

    const cardsHtml = `
      <div class="cards">
        ${rows.map(r => {
          const plat = (r.platform || "unknown").toLowerCase();
          return `
          <div class="card">
            <div class="top">
              <div class="name">${esc(r.label)}</div>
              ${platformPill(plat)}
            </div>
            <div class="grid">
              <div class="field">
                <span class="k">Queue</span>
                <span class="v">${esc(r.queue_name || "—")}</span>
              </div>
              <div class="field">
                <span class="k">Free slots</span>
                <span class="v">${r.slots_free}</span>
              </div>
              <div class="field">
                <span class="k">Scheduled</span>
                <span class="v">${r.scheduled_total}</span>
              </div>
              <div class="field">
                <span class="k">Next slot</span>
                <span class="v">${esc(fmtDate(r.next_slot))}</span>
              </div>
            </div>
            ${r.error ? `<div class="err">${esc(r.error)}</div>` : ""}
            <div class="actions">
              <button class="btn" data-zernio-posts="${esc(r.niche)}">📋 View posts</button>
            </div>
          </div>`;
        }).join("")}
      </div>
    `;

    const tableHtml = `
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Niche</th>
              <th>Platform</th>
              <th>Queue</th>
              <th>Free slots</th>
              <th>Scheduled</th>
              <th>Next slot</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            ${rows.map(r => {
              const plat = (r.platform || "unknown").toLowerCase();
              return `
              <tr>
                <td>
                  <strong>${esc(r.label)}</strong>
                  ${r.error ? `<div class="err">${esc(r.error)}</div>` : ""}
                </td>
                <td>${platformPill(plat)}</td>
                <td>${esc(r.queue_name || "—")}</td>
                <td>${r.slots_free}</td>
                <td>${r.scheduled_total}</td>
                <td>${esc(fmtDate(r.next_slot))}</td>
                <td>
                  <button class="btn" data-zernio-posts="${esc(r.niche)}">📋 View posts</button>
                </td>
              </tr>`;
            }).join("")}
          </tbody>
        </table>
      </div>
    `;

    $("zernio-body").innerHTML = cardsHtml + tableHtml;

    $("zernio-body").querySelectorAll("[data-zernio-posts]").forEach(b => {
      b.addEventListener("click", () => loadZernioPosts(b.dataset.zernioPosts, b));
    });
  } catch (e) {
    $("zernio-body").innerHTML =
      `<div class="empty err">Error: ${esc(e.message)}</div>`;
    if (force) {
      $("zernio-refresh-status").innerHTML =
        `<span class="err">refresh failed</span>`;
    }
  } finally {
    zernioInFlight = false;
  }
}

async function loadZernioPosts(niche, btn) {
  const card = btn.closest(".card");
  const row = btn.closest("tr");
  let label = niche, platform = "";
  if (card) {
    label = (card.querySelector(".name") || {}).textContent || niche;
    const pill = card.querySelector(".pill");
    platform = pill ? pill.textContent.trim() : "";
  } else if (row) {
    label = (row.querySelector("strong") || {}).textContent || niche;
    const pill = row.querySelector(".pill");
    platform = pill ? pill.textContent.trim() : "";
  }

  $("zernio-detail").innerHTML =
    `<div class="empty">Loading posts for ${esc(label)}…</div>`;

  const t0 = performance.now();
  try {
    const r = await fetch(
      `/api/zernio/posts/${encodeURIComponent(niche)}?limit=50`
    );
    const d = await r.json();
    if (!d.success) throw new Error(d.error || "failed");

    const posts = d.posts || [];
    const pag   = d.pagination || {};
    const total = pag.total || posts.length;
    const pages = pag.pages || 1;
    const elapsed = Math.round(performance.now() - t0);

    const platformPillHtml = platform
      ? platformPill(platform.trim().toLowerCase())
      : "";

    const cardsHtml = `
      <div class="cards">
        ${posts.map(p => `
          <div class="card">
            <div class="top">
              <div class="name">${esc(p.title || "(untitled)")}</div>
            </div>
            <div class="grid">
              <div class="field">
                <span class="k">Scheduled</span>
                <span class="v">${esc(fmtDate(p.scheduled_for))}</span>
              </div>
              <div class="field">
                <span class="k">Status</span>
                <span class="v">${esc(p.status)}</span>
              </div>
            </div>
            ${p.media_url
              ? `<div class="actions">
                   <a href="${esc(p.media_url)}" target="_blank" rel="noopener"
                      style="flex:1;text-decoration:none">
                     <button class="btn" style="width:100%">▶ Open video</button>
                   </a>
                 </div>`
              : ""}
          </div>
        `).join("")}
      </div>
    `;

    const tableHtml = `
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Title</th><th>Scheduled</th><th>Status</th><th>Video</th></tr>
          </thead>
          <tbody>
            ${posts.map(p => `
              <tr>
                <td class="title-cell" title="${esc(p.title)}">${esc(p.title || "(untitled)")}</td>
                <td>${esc(fmtDate(p.scheduled_for))}</td>
                <td>${esc(p.status)}</td>
                <td>
                  ${p.media_url
                    ? `<a href="${esc(p.media_url)}" target="_blank" rel="noopener">open</a>`
                    : "—"}
                </td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      </div>
    `;

    $("zernio-detail").innerHTML = `
      <h2 class="section-title" style="margin-top:24px">
        ${esc(label)}
        ${platformPillHtml}
        <small>${total} scheduled · page ${pag.page || 1}/${pages} · ${elapsed}ms</small>
      </h2>
      ${cardsHtml + tableHtml}
    `;
  } catch (e) {
    $("zernio-detail").innerHTML =
      `<div class="empty err" style="margin-top:24px">Error: ${esc(e.message)}</div>`;
  }
}

// Refresh button inside Zernio panel
document.getElementById("zernio-refresh").addEventListener("click", () => {
  const btn = $("zernio-refresh");
  btn.disabled = true;
  btn.classList.add("spinning");
  $("zernio-refresh-status").innerHTML =
    `<span class="live-tag">warming cache…</span>`;

  fetch("/api/zernio/refresh", { method: "POST" })
    .then(() => {
      setTimeout(() => {
        loadZernio(true).finally(() => {
          btn.disabled = false;
          btn.classList.remove("spinning");
        });
      }, 1200);
    })
    .catch(() => {
      $("zernio-refresh-status").innerHTML =
        `<span class="err">refresh failed</span>`;
      btn.disabled = false;
      btn.classList.remove("spinning");
    });
});

// -----------------------------------------------------
// ACCOUNTS TAB
// -----------------------------------------------------
let ACCOUNTS_DATA = null;
let ACCOUNTS_VIEW = "workspace";
let ACCOUNTS_FILTER = "all";
let ACCOUNTS_QUERY = "";

async function loadAccounts() {
  if (!$("accounts-body").innerHTML.trim()) {
    $("accounts-body").innerHTML = `<div class="empty">Loading accounts…</div>`;
  }
  try {
    const r = await fetch("/api/accounts");
    const d = await r.json();
    if (!d.success) throw new Error(d.error || "failed");
    ACCOUNTS_DATA = d.rows || [];
    renderAccounts();
  } catch (e) {
    $("accounts-body").innerHTML =
      `<div class="empty err">Error: ${esc(e.message)}</div>`;
  }
}

function accountMatchesFilter(row, filter) {
  if (filter === "all") return true;
  if (filter === "buffer" || filter === "zernio") return row.publisher === filter;
  if (filter === "missing") return !row.email;
  return row.platform === filter;
}

function accountMatchesQuery(row, q) {
  if (!q) return true;
  const needle = q.toLowerCase();
  return (
    (row.label || "").toLowerCase().includes(needle) ||
    (row.key || "").toLowerCase().includes(needle) ||
    (row.email || "").toLowerCase().includes(needle) ||
    (row.channel_id || "").toLowerCase().includes(needle) ||
    (row.account_id || "").toLowerCase().includes(needle) ||
    (row.profile_id || "").toLowerCase().includes(needle)
  );
}

function renderAccounts() {
  if (!ACCOUNTS_DATA) return;

  const filtered = ACCOUNTS_DATA.filter(r =>
    accountMatchesFilter(r, ACCOUNTS_FILTER) &&
    accountMatchesQuery(r, ACCOUNTS_QUERY)
  );

  const total = ACCOUNTS_DATA.length;
  const withEmail = ACCOUNTS_DATA.filter(r => r.email).length;
  const workspaces = new Set(ACCOUNTS_DATA.map(r => r.email || "__none__")).size;
  $("accounts-count").innerHTML =
    `${filtered.length}/${total} niches · ${withEmail} with email · ${workspaces} workspace(s)`;

  const platforms = Array.from(new Set(ACCOUNTS_DATA.map(r => r.platform).filter(Boolean)));
  const filterDefs = [
    { key: "all", label: "All" },
    { key: "buffer", label: "Buffer" },
    { key: "zernio", label: "Zernio" },
    ...platforms.map(p => ({ key: p, label: p })),
    { key: "missing", label: "Missing email" },
  ];
  $("accounts-filters").innerHTML = filterDefs.map(f =>
    `<button class="chip ${f.key === ACCOUNTS_FILTER ? 'active' : ''}"
             data-account-filter="${f.key}">${esc(f.label)}</button>`
  ).join("");

  $("accounts-filters").querySelectorAll("[data-account-filter]").forEach(b => {
    b.addEventListener("click", () => {
      ACCOUNTS_FILTER = b.dataset.accountFilter;
      renderAccounts();
    });
  });

  if (!filtered.length) {
    $("accounts-body").innerHTML = `<div class="empty">No accounts match.</div>`;
    return;
  }

  if (ACCOUNTS_VIEW === "flat") {
    $("accounts-body").innerHTML = renderAccountsFlat(filtered);
  } else {
    $("accounts-body").innerHTML = renderAccountsWorkspaces(filtered);
  }

  $("accounts-body").querySelectorAll("[data-copy-email]").forEach(b => {
    b.addEventListener("click", () => {
      const email = b.dataset.copyEmail;
      navigator.clipboard.writeText(email).then(() => {
        b.textContent = "✓";
        setTimeout(() => b.textContent = "📋", 1200);
      }).catch(() => toast("Copy failed", true));
    });
  });
}

function renderAccountsFlat(rows) {
  return `
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Niche</th><th>Publisher</th><th>Platform</th>
            <th>Email</th><th>Channel / Profile ID</th><th></th>
          </tr>
        </thead>
        <tbody>
          ${rows.map(r => `
            <tr>
              <td><strong>${esc(r.label)}</strong></td>
              <td>${esc(r.publisher)}</td>
              <td>${platformPill(r.platform)}</td>
              <td>
                ${r.email
                  ? `<span class="email-cell">${esc(r.email)}</span>`
                  : `<span class="email-missing">missing</span>`}
              </td>
              <td><code class="id-cell">${esc(r.channel_id || r.profile_id || "—")}</code></td>
              <td>
                ${r.email
                  ? `<button class="copy-btn" data-copy-email="${esc(r.email)}" title="Copy email">📋</button>`
                  : ""}
              </td>
            </tr>
          `).join("")}
        </tbody>
      </table>
    </div>
  `;
}

function renderAccountsWorkspaces(rows) {
  const groups = {};
  rows.forEach(r => {
    const k = r.email || "__none__";
    if (!groups[k]) groups[k] = { email: r.email, niches: [] };
    groups[k].niches.push(r);
  });

  const sorted = Object.values(groups).sort((a, b) => {
    if (!a.email && b.email) return 1;
    if (a.email && !b.email) return -1;
    return (a.email || "").localeCompare(b.email || "");
  });

  return sorted.map(g => `
    <div class="workspace">
      <div class="workspace-head">
        <div class="workspace-email">
          ${g.email
            ? `<span class="em">${esc(g.email)}</span>
               <button class="copy-btn" data-copy-email="${esc(g.email)}" title="Copy email">📋</button>`
            : `<span class="em missing">email not set</span>`}
        </div>
        <div class="workspace-count">${g.niches.length} niche${g.niches.length === 1 ? "" : "s"}</div>
      </div>
      <div class="workspace-body">
        ${g.niches.map(r => `
          <div class="workspace-row">
            <div class="wr-name">
              <strong>${esc(r.label)}</strong>
              <span class="wr-key">${esc(r.key)}</span>
            </div>
            <div class="wr-platform">${platformPill(r.platform)}</div>
            <div class="wr-publisher">${esc(r.publisher)}</div>
            <div class="wr-id"><code>${esc(r.channel_id || r.profile_id || r.account_id || "—")}</code></div>
          </div>
        `).join("")}
      </div>
    </div>
  `).join("");
}

document.addEventListener("input", (e) => {
  if (e.target && e.target.id === "accounts-search") {
    ACCOUNTS_QUERY = e.target.value;
    renderAccounts();
  }
});

document.addEventListener("click", (e) => {
  const btn = e.target.closest("[data-account-view]");
  if (!btn) return;
  ACCOUNTS_VIEW = btn.dataset.accountView;
  document.querySelectorAll("[data-account-view]").forEach(b =>
    b.classList.toggle("active", b === btn));
  renderAccounts();
});
