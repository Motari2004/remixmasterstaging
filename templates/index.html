<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f1115">
  <title>📦 Staging + Zernio</title>
  <style>
    :root {
      --bg: #0f1115; --panel: #171a21; --panel2: #1e222b;
      --border: #2a2f3a; --text: #e6e9ef; --muted: #8b93a7;
      --accent: #7c5cff; --accent2: #00d4ff;
      --ok: #22c55e; --warn: #f59e0b; --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { -webkit-text-size-adjust: 100%; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: radial-gradient(1200px 600px at 10% -10%, #1a1f2e, var(--bg)) fixed;
      color: var(--text); min-height: 100vh;
      padding: 16px;
      overflow-x: hidden;
    }
    .app { max-width: 1200px; margin: 0 auto; }

    h1 {
      font-size: 1.4rem; margin-bottom: 4px;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      -webkit-background-clip: text; background-clip: text; color: transparent;
      word-break: break-word;
    }
    .sub { color: var(--muted); margin-bottom: 16px; font-size: 0.8rem; }
    a { color: var(--accent2); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

    /* ------- Nav: horizontal scroll on mobile ------- */
    .nav {
      display: flex; gap: 4px; margin-bottom: 16px;
      background: var(--panel2); padding: 4px; border-radius: 10px;
      border: 1px solid var(--border);
      width: 100%;
      overflow-x: auto;
      overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .nav::-webkit-scrollbar { display: none; }
    .nav button {
      padding: 10px 14px; border-radius: 7px; background: transparent;
      color: var(--muted); border: none; cursor: pointer;
      font-size: 0.85rem; font-weight: 600; font-family: inherit;
      white-space: nowrap;
      flex-shrink: 0;
      min-height: 40px;
    }
    .nav button:hover { color: var(--text); }
    .nav button.active {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: white;
    }

    /* ------- Stats: 2x2 grid on mobile ------- */
    .stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }
    .stat {
      background: var(--panel); padding: 12px 14px; border-radius: 10px;
      border: 1px solid var(--border);
      min-width: 0;
    }
    .stat strong {
      display: block; font-size: 1.3rem; color: var(--accent2);
      margin-bottom: 2px; font-variant-numeric: tabular-nums;
    }
    .stat span {
      color: var(--muted); font-size: 0.68rem;
      text-transform: uppercase; letter-spacing: 0.6px;
      line-height: 1.3;
      display: block;
      word-break: break-word;
    }

    /* ------- Tables: horizontal scroll wrapper ------- */
    .table-wrap {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--panel);
    }
    .table-wrap::-webkit-scrollbar { height: 6px; }
    .table-wrap::-webkit-scrollbar-thumb {
      background: var(--border); border-radius: 3px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: transparent;
      min-width: 600px;
    }
    th, td {
      padding: 10px 12px; text-align: left;
      border-bottom: 1px solid var(--border);
      font-size: 0.82rem;
      white-space: nowrap;
    }
    th {
      background: var(--panel2); color: var(--muted);
      font-size: 0.66rem; text-transform: uppercase; letter-spacing: 0.8px;
      position: sticky; top: 0; z-index: 1;
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: var(--panel2); }
    .title-cell {
      max-width: 260px; overflow: hidden;
      text-overflow: ellipsis; white-space: nowrap;
    }

    /* ------- Pills ------- */
    .pill {
      display: inline-block; padding: 3px 9px; border-radius: 999px;
      font-size: 0.66rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.4px; white-space: nowrap;
    }
    .pill.direct  { background: rgba(34,197,94,0.15);  color: #4ade80; }
    .pill.staging { background: rgba(245,158,11,0.15); color: #fcd34d; }
    .pill.insta,
    .pill.instagram { background: rgba(124,92,255,0.15); color: #a78bfa; }
    .pill.tiktok  { background: rgba(0,212,255,0.15);  color: #67e8f9; }
    .pill.youtube { background: rgba(239,68,68,0.15);  color: #fca5a5; }
    .pill.facebook{ background: rgba(59,130,246,0.15); color: #93c5fd; }
    .pill.zernio  { background: rgba(139,92,246,0.15); color: #c4b5fd; }
    .pill.unknown { background: rgba(139,148,167,0.15); color: #8b93a7; }

    /* ------- Buttons ------- */
    button {
      cursor: pointer; background: var(--panel2); color: var(--text);
      border: 1px solid var(--border); border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.82rem; font-family: inherit;
      min-height: 40px;
      transition: border-color 0.15s ease, transform 0.1s ease;
    }
    button:hover { border-color: var(--accent); }
    button:active { transform: scale(0.98); }
    button.danger { color: #fca5a5; }

    .empty {
      padding: 30px 20px; text-align: center; color: var(--muted);
      background: var(--panel); border-radius: 10px;
      border: 1px dashed var(--border); font-size: 0.9rem;
    }

    .view { display: none; }
    .view.active { display: block; }

    .section-title {
      font-size: 1rem; margin-bottom: 12px;
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    }
    .section-title small {
      color: var(--muted); font-size: 0.75rem;
      font-weight: normal;
    }

    /* ------- Toast ------- */
    .toast {
      position: fixed;
      left: 16px; right: 16px;
      bottom: 16px;
      background: var(--panel2); border: 1px solid var(--accent);
      color: var(--text); padding: 12px 16px; border-radius: 10px;
      font-size: 0.85rem; z-index: 999;
      box-shadow: 0 8px 30px rgba(0,0,0,0.5);
      text-align: center;
    }
    .toast.err { border-color: var(--danger); }

    .err { color: var(--danger); font-size: 0.75rem; }

    /* ------- Zernio header ------- */
    .zernio-header {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 14px;
    }
    .zernio-title {
      font-size: 1rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .zernio-title .badge {
      font-size: 0.65rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.8px;
      padding: 3px 9px; border-radius: 999px;
      background: rgba(139,92,246,0.15); color: #c4b5fd;
    }
    .zernio-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .zernio-cache {
      font-size: 0.72rem;
      color: var(--muted);
      flex: 1 1 auto;
      min-width: 0;
    }
    .zernio-cache .cache-tag { color: var(--accent2); }
    .zernio-cache .live-tag  { color: var(--ok); }

    /* ------- Refresh button ------- */
    .refresh-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 16px;
      border-radius: 8px;
      background: linear-gradient(135deg,
        rgba(124,92,255,0.22), rgba(0,212,255,0.22));
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 0.82rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.15s ease;
      min-height: 40px;
      flex-shrink: 0;
    }
    .refresh-btn:hover {
      border-color: var(--accent);
      background: linear-gradient(135deg,
        rgba(124,92,255,0.32), rgba(0,212,255,0.32));
    }
    .refresh-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .refresh-btn .icon {
      display: inline-block;
      font-size: 0.95rem;
    }
    .refresh-btn.spinning .icon {
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    .refresh-status {
      font-size: 0.72rem;
      min-height: 1em;
    }
    .refresh-status .live-tag { color: var(--ok); }
    .refresh-status .err { color: var(--danger); }

    /* ------- Platform breakdown ------- */
    .platform-breakdown {
      margin-bottom: 14px;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      align-items: center;
    }
    .platform-breakdown .label {
      color: var(--muted);
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-right: 2px;
    }

    /* ================================================
       TABLET (>= 640px)
       ================================================ */
    @media (min-width: 640px) {
      body { padding: 20px; }
      h1 { font-size: 1.5rem; }
      .stats { grid-template-columns: repeat(4, 1fr); gap: 12px; }
      .stat strong { font-size: 1.4rem; }
      .stat span { font-size: 0.7rem; }
      .zernio-header {
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
      }
      .zernio-actions { flex: 0 1 auto; }
      .zernio-cache { flex: 0 1 auto; }
      .toast {
        left: auto; right: 24px; bottom: 24px;
        max-width: 400px;
        text-align: left;
      }
    }

    /* ================================================
       DESKTOP (>= 900px)
       ================================================ */
    @media (min-width: 900px) {
      body { padding: 24px; }
      h1 { font-size: 1.6rem; }
      .nav { width: fit-content; }
      .stat strong { font-size: 1.5rem; }
      .stat span { font-size: 0.75rem; }
      table { min-width: 0; }
      th, td { padding: 10px 14px; font-size: 0.85rem; }
      .title-cell { max-width: 380px; }
    }

    /* ------- Mobile-only: stacked card view ------- */
    @media (max-width: 639px) {
      .zernio-cards { display: flex; flex-direction: column; gap: 10px; }
      .zernio-card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 12px;
      }
      .zernio-card .top {
        display: flex; justify-content: space-between;
        align-items: flex-start; gap: 8px;
        margin-bottom: 10px;
      }
      .zernio-card .name {
        font-weight: 600; font-size: 0.95rem;
        min-width: 0;
        word-break: break-word;
      }
      .zernio-card .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px 12px;
        margin-bottom: 10px;
      }
      .zernio-card .field .k {
        display: block;
        color: var(--muted);
        font-size: 0.62rem;
        text-transform: uppercase;
        letter-spacing: 0.8px;
        margin-bottom: 2px;
      }
      .zernio-card .field .v {
        font-size: 0.85rem;
        font-variant-numeric: tabular-nums;
      }
      .zernio-card .actions {
        display: flex;
        gap: 8px;
      }
      .zernio-card .actions button {
        flex: 1;
      }
    }
  </style>
</head>
<body>
<div class="app">

  <h1>📦 Staging + Zernio</h1>
  <div class="sub">Buffer queue · Zernio queue · both live</div>

  <div class="nav">
    <button data-nav="dashboard" class="active">📊 Buffer</button>
    <button data-nav="zernio">🎬 Zernio</button>
    <button data-nav="log">📜 Sent Log</button>
  </div>

  <!-- =================== BUFFER DASHBOARD =================== -->
  <section id="view-dashboard" class="view active">
    <div class="stats" id="stats"></div>
    <div id="dashboard-body"></div>
  </section>

  <!-- =================== ZERNIO =================== -->
  <section id="view-zernio" class="view">

    <div class="zernio-header">
      <div class="zernio-title">
        🎬 Zernio Queue
        <span class="badge">live</span>
      </div>

      <div class="zernio-actions">
        <span class="zernio-cache" id="zernio-cache-info">—</span>
        <span class="refresh-status" id="zernio-refresh-status"></span>
        <button class="refresh-btn" id="zernio-refresh" title="Force refresh from Zernio">
          <span class="icon">🔄</span>
          <span>Refresh</span>
        </button>
      </div>
    </div>

    <div class="stats" id="zernio-stats"></div>
    <div class="platform-breakdown" id="zernio-platform-breakdown" style="display:none;"></div>
    <div id="zernio-body"></div>
    <div id="zernio-detail"></div>
  </section>

  <!-- =================== LOG =================== -->
  <section id="view-log" class="view">
    <h2 class="section-title">Recent Buffer sends</h2>
    <div id="log-body"></div>
  </section>

</div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);

function showView(name) {
  document.querySelectorAll(".view").forEach(v =>
    v.classList.toggle("active", v.id === "view-" + name));
  document.querySelectorAll(".nav button[data-nav]").forEach(b =>
    b.classList.toggle("active", b.dataset.nav === name));
}

document.querySelectorAll("[data-nav]").forEach(b => {
  b.addEventListener("click", (e) => {
    e.preventDefault();
    const t = b.dataset.nav;
    showView(t);
    if (t === "dashboard") loadDashboard();
    if (t === "zernio") loadZernio(false);
    if (t === "log") loadLog();
  });
});

function toast(msg, isError) {
  const t = document.createElement("div");
  t.className = "toast" + (isError ? " err" : "");
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 4000);
}

function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function fmtDate(iso) {
  if (!iso) return "—";
  try {
    const d = new Date(iso);
    return d.toLocaleString("en-GB", {
      timeZone: "Africa/Nairobi",
      year: "numeric", month: "short", day: "2-digit",
      hour: "2-digit", minute: "2-digit",
    });
  } catch (e) { return iso; }
}

function isMobile() {
  return window.matchMedia("(max-width: 639px)").matches;
}

// -----------------------------------------------------
// BUFFER DASHBOARD
// -----------------------------------------------------
async function loadDashboard() {
  try {
    const r = await fetch("/api/summary");
    const d = await r.json();
    const rows = d.rows || [];
    const totalPending = rows.reduce((s, r) => s + (r.pending || 0), 0);
    const totalSent    = rows.reduce((s, r) => s + (r.sent_today || 0), 0);

    $("stats").innerHTML = `
      <div class="stat"><strong>${rows.length}</strong><span>Buffer channels</span></div>
      <div class="stat"><strong>${totalPending}</strong><span>Staged pending</span></div>
      <div class="stat"><strong>${totalSent}</strong><span>Sent today</span></div>
    `;

    if (!rows.length) {
      $("dashboard-body").innerHTML =
        `<div class="empty">No Buffer niches found.</div>`;
      return;
    }

    if (isMobile()) {
      $("dashboard-body").innerHTML = `
        <div class="zernio-cards">
          ${rows.map(r => `
            <div class="zernio-card">
              <div class="top">
                <div class="name">${esc(r.label)}</div>
                <span class="pill ${esc(r.mode)}">${esc(r.mode)}</span>
              </div>
              <div class="grid">
                <div class="field">
                  <span class="k">Platform</span>
                  <span class="v"><span class="pill ${esc(r.platform)}">${esc(r.platform)}</span></span>
                </div>
                <div class="field">
                  <span class="k">Pending</span>
                  <span class="v">${r.pending}</span>
                </div>
                <div class="field">
                  <span class="k">Sent today</span>
                  <span class="v">${r.sent_today}</span>
                </div>
                <div class="field">
                  <span class="k">Last drain</span>
                  <span class="v">${esc(fmtDate(r.last_drain))}</span>
                </div>
              </div>
            </div>
          `).join("")}
        </div>
      `;
    } else {
      $("dashboard-body").innerHTML = `
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Niche</th><th>Platform</th><th>Mode</th>
                <th>Pending</th><th>Sent today</th><th>Last drain</th>
              </tr>
            </thead>
            <tbody>
              ${rows.map(r => `
                <tr>
                  <td>${esc(r.label)}</td>
                  <td><span class="pill ${esc(r.platform)}">${esc(r.platform)}</span></td>
                  <td><span class="pill ${esc(r.mode)}">${esc(r.mode)}</span></td>
                  <td>${r.pending}</td>
                  <td>${r.sent_today}</td>
                  <td>${esc(fmtDate(r.last_drain))}</td>
                </tr>
              `).join("")}
            </tbody>
          </table>
        </div>
      `;
    }
  } catch (e) {
    toast("Dashboard error: " + e.message, true);
  }
}

// -----------------------------------------------------
// ZERNIO PANEL
// -----------------------------------------------------
let zernioLastLoad = 0;
let zernioInFlight = false;

async function loadZernio(force) {
  const now = performance.now();
  if (!force && zernioInFlight) return;
  if (!force && now - zernioLastLoad < 500) return;
  zernioLastLoad = now;
  zernioInFlight = true;

  const t0 = performance.now();
  const url = "/api/zernio/niches" + (force ? "?force=1" : "");

  if (force) {
    $("zernio-refresh-status").innerHTML =
      `<span class="live-tag">refreshing…</span>`;
  }

  if (!$("zernio-body").innerHTML.trim()) {
    $("zernio-body").innerHTML =
      `<div class="empty">Loading Zernio niches…</div>`;
  }

  try {
    const r = await fetch(url);
    const d = await r.json();
    const elapsed = Math.round(performance.now() - t0);
    const rows = d.rows || [];

    const totalScheduled = rows.reduce((s, r) => s + (r.scheduled_total || 0), 0);
    const totalSlots     = rows.reduce((s, r) => s + (r.slots_free || 0), 0);
    const okCount        = rows.filter(r => !r.error).length;

    $("zernio-stats").innerHTML = `
      <div class="stat"><strong>${rows.length}</strong><span>Zernio channels</span></div>
      <div class="stat"><strong>${okCount}</strong><span>Reachable</span></div>
      <div class="stat"><strong>${totalSlots}</strong><span>Free slots</span></div>
      <div class="stat"><strong>${totalScheduled}</strong><span>Scheduled</span></div>
    `;

    const byPlatform = {};
    rows.forEach(r => {
      const p = (r.platform || "unknown").toLowerCase();
      byPlatform[p] = (byPlatform[p] || 0) + 1;
    });
    const bdEl = $("zernio-platform-breakdown");
    if (Object.keys(byPlatform).length) {
      const pills = Object.entries(byPlatform)
        .sort()
        .map(([p, n]) =>
          `<span class="pill ${esc(p)}">${esc(p)} · ${n}</span>`)
        .join(" ");
      bdEl.innerHTML = `<span class="label">By platform</span> ${pills}`;
      bdEl.style.display = "flex";
    } else {
      bdEl.style.display = "none";
    }

    const tag = d.cached
      ? `<span class="cache-tag">⚡ cached</span>`
      : `<span class="live-tag">🔄 live</span>`;
    $("zernio-cache-info").innerHTML =
      `${tag} · ${elapsed}ms · ${rows.length} niches`;

    if (force) {
      $("zernio-refresh-status").innerHTML =
        `<span class="live-tag">✓ ${elapsed}ms</span>`;
      setTimeout(() => {
        const el = $("zernio-refresh-status");
        if (el) el.textContent = "";
      }, 3000);
    }

    if (!rows.length) {
      $("zernio-body").innerHTML =
        `<div class="empty">No Zernio niches found in settings.json</div>`;
      return;
    }

    if (isMobile()) {
      $("zernio-body").innerHTML = `
        <div class="zernio-cards">
          ${rows.map(r => {
            const plat = (r.platform || "unknown").toLowerCase();
            return `
            <div class="zernio-card">
              <div class="top">
                <div class="name">${esc(r.label)}</div>
                <span class="pill ${esc(plat)}">${esc(plat)}</span>
              </div>
              <div class="grid">
                <div class="field">
                  <span class="k">Queue</span>
                  <span class="v">${esc(r.queue_name || "—")}</span>
                </div>
                <div class="field">
                  <span class="k">Free slots</span>
                  <span class="v">${r.slots_free}</span>
                </div>
                <div class="field">
                  <span class="k">Scheduled</span>
                  <span class="v">${r.scheduled_total}</span>
                </div>
                <div class="field">
                  <span class="k">Next slot</span>
                  <span class="v">${esc(fmtDate(r.next_slot))}</span>
                </div>
              </div>
              ${r.error ? `<div class="err" style="margin-bottom:8px">${esc(r.error)}</div>` : ""}
              <div class="actions">
                <button data-zernio-posts="${esc(r.niche)}">📋 View posts</button>
              </div>
            </div>`;
          }).join("")}
        </div>
      `;
    } else {
      $("zernio-body").innerHTML = `
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Niche</th>
                <th>Platform</th>
                <th>Queue</th>
                <th>Free slots</th>
                <th>Scheduled</th>
                <th>Next slot</th>
                <th></th>
              </tr>
            </thead>
            <tbody>
              ${rows.map(r => {
                const plat = (r.platform || "unknown").toLowerCase();
                return `
                <tr>
                  <td>
                    <strong>${esc(r.label)}</strong>
                    ${r.error ? `<div class="err">${esc(r.error)}</div>` : ""}
                  </td>
                  <td><span class="pill ${esc(plat)}">${esc(plat)}</span></td>
                  <td>${esc(r.queue_name || "—")}</td>
                  <td>${r.slots_free}</td>
                  <td>${r.scheduled_total}</td>
                  <td>${esc(fmtDate(r.next_slot))}</td>
                  <td>
                    <button data-zernio-posts="${esc(r.niche)}">📋 View posts</button>
                  </td>
                </tr>`;
              }).join("")}
            </tbody>
          </table>
        </div>
      `;
    }

    $("zernio-body").querySelectorAll("[data-zernio-posts]").forEach(b => {
      b.addEventListener("click", () => loadZernioPosts(b.dataset.zernioPosts, b));
    });
  } catch (e) {
    $("zernio-body").innerHTML =
      `<div class="empty err">Error: ${esc(e.message)}</div>`;
    if (force) {
      $("zernio-refresh-status").innerHTML =
        `<span class="err">refresh failed</span>`;
    }
  } finally {
    zernioInFlight = false;
  }
}

async function loadZernioPosts(niche, btn) {
  const card = btn.closest(".zernio-card");
  const row = btn.closest("tr");
  let label = niche;
  let platform = "";
  if (card) {
    label = (card.querySelector(".name") || {}).textContent || niche;
    platform = (card.querySelector(".pill") || {}).textContent || "";
  } else if (row) {
    label = (row.querySelector("strong") || {}).textContent || niche;
    platform = (row.querySelector(".pill") || {}).textContent || "";
  }

  $("zernio-detail").innerHTML =
    `<div class="empty">Loading posts for ${esc(label)}…</div>`;

  const t0 = performance.now();
  try {
    const r = await fetch(
      `/api/zernio/posts/${encodeURIComponent(niche)}?limit=50`
    );
    const d = await r.json();
    if (!d.success) throw new Error(d.error || "failed");

    const posts = d.posts || [];
    const pag   = d.pagination || {};
    const total = pag.total || posts.length;
    const pages = pag.pages || 1;
    const elapsed = Math.round(performance.now() - t0);

    const platformPill = platform
      ? `<span class="pill ${esc(platform.trim().toLowerCase())}">${esc(platform.trim())}</span>`
      : "";

    let postsHtml;
    if (isMobile()) {
      postsHtml = `
        <div class="zernio-cards">
          ${posts.map(p => `
            <div class="zernio-card">
              <div class="top">
                <div class="name">${esc(p.title || "(untitled)")}</div>
              </div>
              <div class="grid">
                <div class="field">
                  <span class="k">Scheduled</span>
                  <span class="v">${esc(fmtDate(p.scheduled_for))}</span>
                </div>
                <div class="field">
                  <span class="k">Status</span>
                  <span class="v">${esc(p.status)}</span>
                </div>
              </div>
              ${p.media_url
                ? `<div class="actions"><a href="${esc(p.media_url)}" target="_blank"><button>▶ Open video</button></a></div>`
                : ""}
            </div>
          `).join("")}
        </div>
      `;
    } else {
      postsHtml = `
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>Title</th><th>Scheduled</th><th>Status</th><th>Video</th></tr>
            </thead>
            <tbody>
              ${posts.map(p => `
                <tr>
                  <td class="title-cell" title="${esc(p.title)}">${esc(p.title || "(untitled)")}</td>
                  <td>${esc(fmtDate(p.scheduled_for))}</td>
                  <td>${esc(p.status)}</td>
                  <td>
                    ${p.media_url
                      ? `<a href="${esc(p.media_url)}" target="_blank">open</a>`
                      : "—"}
                  </td>
                </tr>
              `).join("")}
            </tbody>
          </table>
        </div>
      `;
    }

    $("zernio-detail").innerHTML = `
      <h2 class="section-title" style="margin-top:24px">
        ${esc(label)}
        ${platformPill}
        <small>${total} scheduled · page ${pag.page || 1}/${pages} · ${elapsed}ms</small>
      </h2>
      ${postsHtml}
    `;
  } catch (e) {
    $("zernio-detail").innerHTML =
      `<div class="empty err" style="margin-top:24px">Error: ${esc(e.message)}</div>`;
  }
}

// Force-refresh button inside Zernio panel
document.getElementById("zernio-refresh").addEventListener("click", () => {
  const btn = $("zernio-refresh");
  btn.disabled = true;
  btn.classList.add("spinning");
  $("zernio-refresh-status").innerHTML =
    `<span class="live-tag">warming cache…</span>`;

  fetch("/api/zernio/refresh", { method: "POST" })
    .then(() => {
      setTimeout(() => {
        loadZernio(true).finally(() => {
          btn.disabled = false;
          btn.classList.remove("spinning");
        });
      }, 1200);
    })
    .catch(() => {
      $("zernio-refresh-status").innerHTML =
        `<span class="err">refresh failed</span>`;
      btn.disabled = false;
      btn.classList.remove("spinning");
    });
});

// -----------------------------------------------------
// LOG
// -----------------------------------------------------
async function loadLog() {
  $("log-body").innerHTML = `<div class="empty">Loading…</div>`;
  try {
    const r = await fetch("/api/log");
    const d = await r.json();
    const rows = d.rows || [];
    if (!rows.length) {
      $("log-body").innerHTML = `<div class="empty">No sends yet.</div>`;
      return;
    }

    if (isMobile()) {
      $("log-body").innerHTML = `
        <div class="zernio-cards">
          ${rows.map(r => `
            <div class="zernio-card">
              <div class="top">
                <div class="name">${esc(r.title)}</div>
              </div>
              <div class="grid">
                <div class="field">
                  <span class="k">Niche</span>
                  <span class="v">${esc(r.niche)}</span>
                </div>
                <div class="field">
                  <span class="k">Sent at</span>
                  <span class="v">${esc(fmtDate(r.sent_at))}</span>
                </div>
              </div>
            </div>
          `).join("")}
        </div>
      `;
    } else {
      $("log-body").innerHTML = `
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>ID</th><th>Niche</th><th>Title</th>
                  <th>Sent at</th><th>Buffer id</th></tr>
            </thead>
            <tbody>
              ${rows.map(r => `
                <tr>
                  <td>${r.id}</td>
                  <td>${esc(r.niche)}</td>
                  <td class="title-cell">${esc(r.title)}</td>
                  <td>${esc(fmtDate(r.sent_at))}</td>
                  <td>${esc(r.buffer_post_id || "—")}</td>
                </tr>
              `).join("")}
            </tbody>
          </table>
        </div>
      `;
    }
  } catch (e) {
    $("log-body").innerHTML =
      `<div class="empty err">Error: ${esc(e.message)}</div>`;
  }
}

// -----------------------------------------------------
// Re-render on orientation change
// -----------------------------------------------------
let lastMobile = isMobile();
window.addEventListener("resize", () => {
  const nowMobile = isMobile();
  if (nowMobile !== lastMobile) {
    lastMobile = nowMobile;
    const active = document.querySelector(".view.active");
    if (!active) return;
    if (active.id === "view-dashboard") loadDashboard();
    if (active.id === "view-zernio") loadZernio(false);
    if (active.id === "view-log") loadLog();
  }
});

// -----------------------------------------------------
// Start
// -----------------------------------------------------
loadDashboard();
</script>
