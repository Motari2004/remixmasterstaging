<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📦 Staging Service</title>
  <style>
    :root {
      --bg: #0f1115; --panel: #171a21; --panel2: #1e222b;
      --border: #2a2f3a; --text: #e6e9ef; --muted: #8b93a7;
      --accent: #7c5cff; --accent2: #00d4ff;
      --ok: #22c55e; --warn: #f59e0b; --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: radial-gradient(1200px 600px at 10% -10%, #1a1f2e, var(--bg)) fixed;
      color: var(--text); min-height: 100vh; padding: 24px;
    }
    .app { max-width: 1200px; margin: 0 auto; }
    h1 { font-size: 1.6rem; margin-bottom: 4px;
         background: linear-gradient(90deg, var(--accent), var(--accent2));
         -webkit-background-clip: text; background-clip: text; color: transparent; }
    .sub { color: var(--muted); margin-bottom: 20px; font-size: 0.85rem; }
    a { color: var(--accent2); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

    /* nav tabs */
    .nav { display: flex; gap: 4px; margin-bottom: 16px;
           background: var(--panel2); padding: 4px; border-radius: 10px;
           border: 1px solid var(--border); width: fit-content; }
    .nav button {
      padding: 7px 14px; border-radius: 7px; background: transparent;
      color: var(--muted); border: none; cursor: pointer;
      font-size: 0.82rem; font-weight: 600; font-family: inherit;
    }
    .nav button:hover { color: var(--text); }
    .nav button.active {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: white;
    }

    /* cards */
    .stats { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
    .stat { background: var(--panel); padding: 12px 18px; border-radius: 10px;
            border: 1px solid var(--border); flex: 1; min-width: 140px; }
    .stat strong { display: block; font-size: 1.5rem; color: var(--accent2);
                   margin-bottom: 2px; }
    .stat span { color: var(--muted); font-size: 0.75rem;
                 text-transform: uppercase; letter-spacing: 1px; }

    /* table */
    table { width: 100%; border-collapse: collapse; background: var(--panel);
            border-radius: 10px; overflow: hidden; }
    th, td { padding: 10px 14px; text-align: left;
             border-bottom: 1px solid var(--border); font-size: 0.85rem; }
    th { background: var(--panel2); color: var(--muted);
         font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px; }
    tr:hover td { background: var(--panel2); }
    .title-cell { max-width: 360px; overflow: hidden;
                  text-overflow: ellipsis; white-space: nowrap; }

    /* pills */
    .pill { display: inline-block; padding: 3px 10px; border-radius: 999px;
            font-size: 0.7rem; font-weight: 700; text-transform: uppercase;
            letter-spacing: 0.5px; }
    .pill.direct  { background: rgba(34,197,94,0.15);  color: #4ade80; }
    .pill.staging { background: rgba(245,158,11,0.15); color: #fcd34d; }
    .pill.insta   { background: rgba(124,92,255,0.15); color: #a78bfa; }
    .pill.tiktok  { background: rgba(0,212,255,0.15);  color: #67e8f9; }
    .pill.youtube { background: rgba(239,68,68,0.15);  color: #fca5a5; }
    .pill.facebook{ background: rgba(59,130,246,0.15); color: #93c5fd; }
    .status-pending { color: #fcd34d; }
    .status-sending { color: var(--accent2); }
    .status-sent    { color: var(--ok); }
    .status-failed  { color: #fca5a5; }

    /* buttons */
    button {
      cursor: pointer; background: var(--panel2); color: var(--text);
      border: 1px solid var(--border); border-radius: 6px;
      padding: 5px 10px; font-size: 0.78rem; font-family: inherit;
      margin-right: 4px;
    }
    button:hover { border-color: var(--accent); }
    button.danger { color: #fca5a5; }
    button.primary {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: white; border: none; font-weight: 700;
    }

    .empty { padding: 30px; text-align: center; color: var(--muted);
             background: var(--panel); border-radius: 10px;
             border: 1px dashed var(--border); }

    /* sections */
    .view { display: none; }
    .view.active { display: block; }

    .section-title { font-size: 1.1rem; margin-bottom: 14px; }
    .section-title small { color: var(--muted); font-size: 0.8rem;
                           font-weight: normal; margin-left: 8px; }

    .back-link { margin-bottom: 14px; display: inline-block; font-size: 0.85rem; }

    .post-detail {
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 10px; padding: 20px;
    }
    .post-detail dt { color: var(--muted); font-size: 0.72rem;
                      text-transform: uppercase; letter-spacing: 1px;
                      margin-top: 14px; }
    .post-detail dd { font-size: 0.88rem; margin-top: 4px;
                      white-space: pre-wrap; word-break: break-word; }
    .post-detail dd a { word-break: break-all; }

    .toast {
      position: fixed; bottom: 24px; right: 24px;
      background: var(--panel2); border: 1px solid var(--accent);
      color: var(--text); padding: 12px 20px; border-radius: 10px;
      font-size: 0.85rem; z-index: 999; max-width: 400px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.4);
      animation: slidein 0.3s ease;
    }
    @keyframes slidein { from { transform: translateY(20px); opacity: 0; }
                         to   { transform: translateY(0);    opacity: 1; } }
  </style>
</head>
<body>
<div class="app">

  <h1>📦 Staging Service</h1>
  <div class="sub">Buffer slot manager · Neon backend</div>

  <div class="nav">
    <button data-nav="dashboard" class="active">📊 Dashboard</button>
    <button data-nav="log">📜 Sent Log</button>
  </div>

  <!-- =================== DASHBOARD =================== -->
  <section id="view-dashboard" class="view active">
    <div class="stats" id="stats"></div>
    <div id="dashboard-body"></div>
  </section>

  <!-- =================== QUEUE =================== -->
  <section id="view-queue" class="view">
    <a class="back-link" href="#" data-nav="dashboard">← Dashboard</a>
    <h2 class="section-title" id="queue-title">Queue <small id="queue-meta"></small></h2>
    <div class="row" style="margin-bottom:14px">
      <button class="primary" id="queue-drain">⬇️ Drain this niche</button>
      <button id="queue-flip-mode">🔄 Flip mode</button>
    </div>
    <div id="queue-body"></div>
  </section>

  <!-- =================== POST =================== -->
  <section id="view-post" class="view">
    <a class="back-link" href="#" id="post-back">← Back</a>
    <h2 class="section-title">Post detail</h2>
    <div id="post-body"></div>
  </section>

  <!-- =================== LOG =================== -->
  <section id="view-log" class="view">
    <h2 class="section-title">Recent sends</h2>
    <div id="log-body"></div>
  </section>

</div>

<script>
"use strict";

const $ = (id) => document.getElementById(id);

// -----------------------------------------------------
// View switching
// -----------------------------------------------------
function showView(name) {
  document.querySelectorAll(".view").forEach(v =>
    v.classList.toggle("active", v.id === "view-" + name));
  document.querySelectorAll(".nav button").forEach(b =>
    b.classList.toggle("active", b.dataset.nav === name));
}

document.querySelectorAll("[data-nav]").forEach(b => {
  b.addEventListener("click", (e) => {
    e.preventDefault();
    const target = b.dataset.nav;
    showView(target);
    if (target === "dashboard") loadDashboard();
    if (target === "log") loadLog();
  });
});

// -----------------------------------------------------
// Toast
// -----------------------------------------------------
function toast(msg, isError) {
  const t = document.createElement("div");
  t.className = "toast";
  if (isError) t.style.borderColor = "var(--danger)";
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 4000);
}

// -----------------------------------------------------
// HTML escaping
// -----------------------------------------------------
function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function fmtDate(iso) {
  if (!iso) return "—";
  try { return new Date(iso).toLocaleString(); } catch (e) { return iso; }
}

// -----------------------------------------------------
// DASHBOARD
// -----------------------------------------------------
async function loadDashboard() {
  try {
    const r = await fetch("/api/summary");
    if (!r.ok) throw new Error("HTTP " + r.status);
    const d = await r.json();
    const rows = d.rows || [];

    const totalPending = rows.reduce((s, r) => s + (r.pending || 0), 0);
    const totalSent    = rows.reduce((s, r) => s + (r.sent_today || 0), 0);
    $("stats").innerHTML = `
      <div class="stat"><strong>${rows.length}</strong><span>Buffer channels</span></div>
      <div class="stat"><strong>${totalPending}</strong><span>Staged pending</span></div>
      <div class="stat"><strong>${totalSent}</strong><span>Sent today</span></div>
    `;

    if (!rows.length) {
      $("dashboard-body").innerHTML =
        `<div class="empty">No Buffer niches found in remixmaster settings.json</div>`;
      return;
    }

    $("dashboard-body").innerHTML = `
      <table>
        <thead>
          <tr>
            <th>Niche</th><th>Platform</th><th>Mode</th>
            <th>Pending</th><th>Sent today</th>
            <th>Last drain</th><th>Actions</th>
          </tr>
        </thead>
        <tbody>
          ${rows.map(r => `
            <tr>
              <td><a href="#" data-open-queue="${esc(r.key)}">${esc(r.label)}</a></td>
              <td><span class="pill ${esc(r.platform)}">${esc(r.platform)}</span></td>
              <td><span class="pill ${esc(r.mode)}">${esc(r.mode)}</span></td>
              <td>${r.pending}</td>
              <td>${r.sent_today}</td>
              <td>${esc(fmtDate(r.last_drain))}</td>
              <td>
                <button data-drain="${esc(r.key)}">⬇️ Drain</button>
                <button data-flip="${esc(r.key)}" data-mode="${r.mode === "staging" ? "direct" : "staging"}">
                  ${r.mode === "staging" ? "➡️ Direct" : "⏸️ Staging"}
                </button>
              </td>
            </tr>
          `).join("")}
        </tbody>
      </table>
    `;

    // wire buttons
    $("dashboard-body").querySelectorAll("[data-open-queue]").forEach(a =>
      a.addEventListener("click", (e) => {
        e.preventDefault();
        openQueue(a.dataset.openQueue);
      }));
    $("dashboard-body").querySelectorAll("[data-drain]").forEach(b =>
      b.addEventListener("click", () => drainNiche(b.dataset.drain)));
    $("dashboard-body").querySelectorAll("[data-flip]").forEach(b =>
      b.addEventListener("click", () => flipMode(b.dataset.flip, b.dataset.mode)));
  } catch (e) {
    toast("Dashboard error: " + e.message, true);
  }
}

async function drainNiche(niche) {
  if (!confirm(`Drain "${niche}" now?`)) return;
  toast("Draining " + niche + "…");
  try {
    const r = await fetch(`/api/drain/${encodeURIComponent(niche)}`,
                         { method: "POST" });
    const d = await r.json();
    if (!d.success) throw new Error(d.error || "failed");
    toast(`Sent: ${d.sent}${d.stopped ? " · " + d.stopped : ""}`);
    loadDashboard();
  } catch (e) {
    toast("Drain error: " + e.message, true);
  }
}

async function flipMode(niche, mode) {
  try {
    const r = await fetch(`/api/mode/${encodeURIComponent(niche)}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ mode }),
    });
    const d = await r.json();
    if (!d.success) throw new Error(d.error || "failed");
    toast(`${niche} → ${mode}`);
    loadDashboard();
  } catch (e) {
    toast("Mode error: " + e.message, true);
  }
}

// -----------------------------------------------------
// QUEUE view
// -----------------------------------------------------
let CURRENT_NICHE = null;
let CURRENT_MODE = "?";

async function openQueue(niche) {
  CURRENT_NICHE = niche;
  showView("queue");
  $("queue-title").firstChild.textContent = niche + " ";
  $("queue-meta").textContent = "loading…";

  try {
    const r = await fetch(`/api/queue/${encodeURIComponent(niche)}`);
    const d = await r.json();
    if (!d.success) throw new Error(d.error || "failed");
    CURRENT_MODE = d.mode;
    $("queue-meta").textContent =
      `${d.items.length} item(s) · mode ${d.mode}`;

    if (!d.items.length) {
      $("queue-body").innerHTML = `<div class="empty">No staged posts for this niche.</div>`;
      return;
    }

    $("queue-body").innerHTML = `
      <table>
        <thead>
          <tr>
            <th>ID</th><th>Title</th><th>Status</th>
            <th>Attempts</th><th>Queued</th><th>Sent</th><th>Actions</th>
          </tr>
        </thead>
        <tbody>
          ${d.items.map(it => `
            <tr>
              <td><a href="#" data-open-post="${it.id}">${it.id}</a></td>
              <td class="title-cell" title="${esc(it.title)}">${esc(it.title)}</td>
              <td class="status-${esc(it.status)}">${esc(it.status)}</td>
              <td>${it.attempts}</td>
              <td>${esc(fmtDate(it.queued_at))}</td>
              <td>${esc(fmtDate(it.sent_at))}</td>
              <td>
                <button data-send="${it.id}">📤 Send</button>
                <button class="danger" data-del="${it.id}">🗑️</button>
              </td>
            </tr>
          `).join("")}
        </tbody>
      </table>
    `;
    $("queue-body").querySelectorAll("[data-open-post]").forEach(a =>
      a.addEventListener("click", (e) => {
        e.preventDefault();
        openPost(+a.dataset.openPost);
      }));
    $("queue-body").querySelectorAll("[data-send]").forEach(b =>
      b.addEventListener("click", () => sendOne(+b.dataset.send)));
    $("queue-body").querySelectorAll("[data-del]").forEach(b =>
      b.addEventListener("click", () => deleteOne(+b.dataset.del)));
  } catch (e) {
    $("queue-body").innerHTML =
      `<div class="empty" style="color:#fca5a5">Error: ${esc(e.message)}</div>`;
  }
}

$("queue-drain").addEventListener("click", () => {
  if (!CURRENT_NICHE) return;
  drainNiche(CURRENT_NICHE).then(() => openQueue(CURRENT_NICHE));
});

$("queue-flip-mode").addEventListener("click", () => {
  if (!CURRENT_NICHE) return;
  const next = CURRENT_MODE === "staging" ? "direct" : "staging";
  flipMode(CURRENT_NICHE, next).then(() => openQueue(CURRENT_NICHE));
});

async function sendOne(id) {
  try {
    const r = await fetch(`/api/send/${id}`, { method: "POST" });
    const d = await r.json();
    toast(d.message || (d.success ? "sent" : "failed"), !d.success);
    if (CURRENT_NICHE) openQueue(CURRENT_NICHE);
  } catch (e) {
    toast("Send error: " + e.message, true);
  }
}

async function deleteOne(id) {
  if (!confirm("Delete this staged post?")) return;
  try {
    const r = await fetch(`/api/delete/${id}`, { method: "POST" });
    const d = await r.json();
    if (!d.success) throw new Error(d.error || "failed");
    toast("deleted");
    if (CURRENT_NICHE) openQueue(CURRENT_NICHE);
  } catch (e) {
    toast("Delete error: " + e.message, true);
  }
}

// -----------------------------------------------------
// POST view
// -----------------------------------------------------
async function openPost(id) {
  showView("post");
  $("post-back").onclick = (e) => {
    e.preventDefault();
    if (CURRENT_NICHE) openQueue(CURRENT_NICHE);
    else showView("dashboard");
  };
  $("post-body").innerHTML = `<div class="empty">Loading…</div>`;
  try {
    const r = await fetch(`/api/post/${id}`);
    const d = await r.json();
    if (!d.success) throw new Error(d.error || "failed");
    const it = d.item;
    $("post-body").innerHTML = `
      <div class="post-detail">
        <dl>
          <dt>ID</dt><dd>${it.id}</dd>
          <dt>Niche</dt><dd>${esc(it.niche)}</dd>
          <dt>Status</dt><dd class="status-${esc(it.status)}">${esc(it.status)}</dd>
          <dt>Attempts</dt><dd>${it.attempts}</dd>
          <dt>Queued</dt><dd>${esc(fmtDate(it.queued_at))}</dd>
          <dt>Sent</dt><dd>${esc(fmtDate(it.sent_at))}</dd>
          <dt>Buffer post id</dt><dd>${esc(it.buffer_post_id || "—")}</dd>
          <dt>Error</dt><dd>${esc(it.error || "—")}</dd>
          <dt>Title</dt><dd>${esc(it.title)}</dd>
          <dt>Caption</dt><dd>${esc(it.caption)}</dd>
          <dt>Video URL</dt>
          <dd><a href="${esc(it.video_url)}" target="_blank">${esc(it.video_url)}</a></dd>
        </dl>
        <div class="row" style="margin-top:16px">
          <button class="primary" data-send-post="${it.id}">📤 Send now</button>
          <button class="danger" data-del-post="${it.id}">🗑️ Delete</button>
        </div>
      </div>
    `;
    $("post-body").querySelector("[data-send-post]").addEventListener("click", () => {
      sendOne(id).then(() => openPost(id));
    });
    $("post-body").querySelector("[data-del-post]").addEventListener("click", () => {
      deleteOne(id).then(() => {
        if (CURRENT_NICHE) openQueue(CURRENT_NICHE);
        else showView("dashboard");
      });
    });
  } catch (e) {
    $("post-body").innerHTML =
      `<div class="empty" style="color:#fca5a5">Error: ${esc(e.message)}</div>`;
  }
}

// -----------------------------------------------------
// LOG
// -----------------------------------------------------
async function loadLog() {
  $("log-body").innerHTML = `<div class="empty">Loading…</div>`;
  try {
    const r = await fetch("/api/log");
    const d = await r.json();
    const rows = d.rows || [];
    if (!rows.length) {
      $("log-body").innerHTML = `<div class="empty">No sends yet.</div>`;
      return;
    }
    $("log-body").innerHTML = `
      <table>
        <thead>
          <tr><th>ID</th><th>Niche</th><th>Title</th>
              <th>Sent at</th><th>Buffer id</th></tr>
        </thead>
        <tbody>
          ${rows.map(r => `
            <tr>
              <td><a href="#" data-open-post="${r.id}">${r.id}</a></td>
              <td>${esc(r.niche)}</td>
              <td class="title-cell">${esc(r.title)}</td>
              <td>${esc(fmtDate(r.sent_at))}</td>
              <td>${esc(r.buffer_post_id || "—")}</td>
            </tr>
          `).join("")}
        </tbody>
      </table>
    `;
    $("log-body").querySelectorAll("[data-open-post]").forEach(a =>
      a.addEventListener("click", (e) => {
        e.preventDefault();
        openPost(+a.dataset.openPost);
      }));
  } catch (e) {
    $("log-body").innerHTML =
      `<div class="empty" style="color:#fca5a5">Error: ${esc(e.message)}</div>`;
  }
}

// -----------------------------------------------------
// Start
// -----------------------------------------------------
loadDashboard();
</script>
</body>
</html>
